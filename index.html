<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jazz Drummer's Etude</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vexflow/3.0.9/vexflow-min.js"></script>
  <style>
    body { background-color: #fdfcf8; color: #1a1a1a; font-family: 'Inter', serif; }
    .book-page {
      background-color: #ffffff;
      border: 1px solid #e5e5e5;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
    }
    .active-bar { background-color: #3b82f6; color: white; border-color: #3b82f6; }
    .fill-bar { background-color: #ef4444; color: white; border-color: #ef4444; }
    #score-container svg { max-width: 100%; height: auto; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4">

  <div class="max-w-4xl w-full space-y-6">
    
    <!-- ヘッダー -->
    <div class="text-center border-b-2 border-gray-200 pb-6 mb-8">
      <h1 class="text-4xl font-bold tracking-tight text-gray-900" style="font-family: 'Times New Roman', Times, serif;">Beyond Bop Etude</h1>
      <p class="text-gray-500 mt-2 font-medium">8-Bar Practice: Snare & Kick Comping (Bars 1-7) + Fill-in (Bar 8)</p>
    </div>

    <!-- コントロールパネル -->
    <div class="book-page p-6 rounded-xl flex flex-col md:flex-row items-center gap-6">
      
      <div class="flex-1 w-full space-y-2">
        <div class="flex justify-between items-end">
          <span class="font-bold text-gray-700 text-sm uppercase tracking-wider">Metronome (BPM)</span>
          <span id="bpm-display" class="font-bold text-3xl text-blue-600">120</span>
        </div>
        <input type="range" id="bpm-slider" min="60" max="250" step="1" value="120" class="w-full accent-blue-600 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" />
      </div>

      <button id="play-btn" class="w-full md:w-48 py-4 rounded-xl font-bold text-lg text-white bg-blue-600 hover:bg-blue-700 transition-all shadow-md">
        START CLICK
      </button>
    </div>

    <!-- 小節トラッカー -->
    <div class="book-page p-5 rounded-xl space-y-3">
      <div class="flex justify-between items-center px-1">
        <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Phrase Tracker</span>
        <span id="status-text" class="text-xs font-bold text-blue-600 uppercase">Ready</span>
      </div>
      <div class="grid grid-cols-8 gap-2" id="bar-tracker">
        <!-- JSで生成 -->
      </div>
    </div>

    <!-- 楽譜表示エリア -->
    <div class="book-page p-6 rounded-xl flex flex-col items-center overflow-x-auto">
      <div id="score-container" class="w-full flex justify-center min-w-[800px]"></div>
      <p class="text-sm text-gray-500 mt-6 text-center">※ライドとハイハットは4/4ジャズパターンをキープし、記譜されたスネアとキックを演奏してください。</p>
    </div>

  </div>

  <script>
    // --- UI Elements ---
    const playBtn = document.getElementById('play-btn');
    const bpmSlider = document.getElementById('bpm-slider');
    const bpmDisplay = document.getElementById('bpm-display');
    const barTracker = document.getElementById('bar-tracker');
    const statusText = document.getElementById('status-text');

    // トラッカー生成
    const bars = [];
    for(let i = 1; i <= 8; i++) {
      const div = document.createElement('div');
      div.className = 'h-12 flex items-center justify-center rounded-lg border-2 border-gray-200 text-gray-400 font-bold text-lg bg-gray-50 transition-all duration-75';
      div.textContent = i;
      barTracker.appendChild(div);
      bars.push(div);
    }

    let isPlaying = false;
    let currentBpm = 120;
    
    // メトロノーム音源 (Tone.js)
    let clickHigh, clickLow;

    function initAudio() {
      if(clickHigh) return;
      // 鋭いクリック音を作成
      clickHigh = new Tone.Synth({
        oscillator: { type: "square" },
        envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.01 },
        volume: -5
      }).toDestination();
      
      clickLow = new Tone.Synth({
        oscillator: { type: "square" },
        envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.01 },
        volume: -10
      }).toDestination();
    }

    // --- メインループ (4分音符のメトロノーム) ---
    async function togglePlayback() {
      if (isPlaying) {
        Tone.Transport.stop();
        Tone.Transport.cancel();
        isPlaying = false;
        
        playBtn.textContent = "START CLICK";
        playBtn.className = "w-full md:w-48 py-4 rounded-xl font-bold text-lg text-white bg-blue-600 hover:bg-blue-700 transition-all shadow-md";
        
        bars.forEach(b => {
          b.classList.remove('active-bar', 'fill-bar');
          b.classList.add('border-gray-200', 'text-gray-400', 'bg-gray-50');
        });
        statusText.textContent = "Ready";

      } else {
        await Tone.start();
        initAudio();
        
        Tone.Transport.bpm.value = currentBpm;

        let barCount = 1;
        let beatCount = 0; // 0, 1, 2, 3 (4分音符)

        Tone.Transport.scheduleRepeat((time) => {
          
          // メトロノームのクリック音 (1拍目だけ高い音)
          if (beatCount === 0) {
            clickHigh.triggerAttackRelease("A5", "32n", time);
          } else {
            clickLow.triggerAttackRelease("A4", "32n", time);
          }

          // UI Update (小節の頭でトラッカーを更新)
          if (beatCount === 0) {
            Tone.Draw.schedule(() => {
              bars.forEach(b => {
                b.classList.remove('active-bar', 'fill-bar');
                b.classList.add('border-gray-200', 'text-gray-400', 'bg-gray-50');
              });
              
              const activeDiv = bars[barCount - 1];
              activeDiv.classList.remove('border-gray-200', 'text-gray-400', 'bg-gray-50');
              
              if (barCount === 8) {
                activeDiv.classList.add('fill-bar');
                statusText.textContent = "Bar 8: Fill-in";
                statusText.className = "text-xs font-bold text-red-500 uppercase tracking-wider";
              } else {
                activeDiv.classList.add('active-bar');
                statusText.textContent = `Bar ${barCount}: Comping`;
                statusText.className = "text-xs font-bold text-blue-600 uppercase tracking-wider";
              }
            }, time);
          }

          beatCount++;
          if (beatCount > 3) {
            beatCount = 0;
            barCount++;
            if (barCount > 8) barCount = 1; // 8小節ループ
          }
        }, "4n");

        Tone.Transport.start();
        isPlaying = true;
        playBtn.textContent = "STOP";
        playBtn.className = "w-full md:w-48 py-4 rounded-xl font-bold text-lg text-red-600 bg-red-100 hover:bg-red-200 transition-all shadow-md";
      }
    }

    // --- イベントリスナー ---
    playBtn.addEventListener('click', togglePlayback);
    
    bpmSlider.addEventListener('input', (e) => {
      currentBpm = Number(e.target.value);
      bpmDisplay.textContent = currentBpm;
      if (Tone.Transport.state === "started") {
        Tone.Transport.bpm.value = currentBpm;
      }
    });

    // --- 楽譜の描画 (VexFlow) ---
    function drawScore() {
      const VF = Vex.Flow;
      const container = document.getElementById("score-container");
      container.innerHTML = ""; 

      const renderer = new VF.Renderer(container, VF.Renderer.Backends.SVG);
      renderer.resize(850, 300); // 2段表示のための高さ
      const context = renderer.getContext();

      // 音符生成のヘルパー (Snare: c/5, Kick: f/4, Rest: b/4)
      const n = (keys, duration) => new VF.StaveNote({ clef: "percussion", keys: keys, duration: duration });

      // 【1〜4小節目】(上段)
      const stave1 = new VF.Stave(10, 20, 240).addClef("percussion").addTimeSignature("4/4");
      const stave2 = new VF.Stave(stave1.width + stave1.x, 20, 190);
      const stave3 = new VF.Stave(stave2.width + stave2.x, 20, 190);
      const stave4 = new VF.Stave(stave3.width + stave3.x, 20, 190);

      // Bar 1: Snare on 2-and
      const notes1 = [ n(["b/4"], "qr"), n(["c/5"], "8"), n(["b/4"], "8r"), n(["b/4"], "hr") ];
      // Bar 2: Kick on 4-and
      const notes2 = [ n(["b/4"], "hr"), n(["b/4"], "qr"), n(["b/4"], "8r"), n(["f/4"], "8") ];
      // Bar 3: Snare on 2, Kick on 3-and
      const notes3 = [ n(["b/4"], "qr"), n(["c/5"], "q"), n(["b/4"], "8r"), n(["f/4"], "8"), n(["b/4"], "qr") ];
      // Bar 4: Snare on 1-and, Kick on 4
      const notes4 = [ n(["b/4"], "8r"), n(["c/5"], "8"), n(["b/4"], "qr"), n(["b/4"], "qr"), n(["f/4"], "q") ];

      [stave1, stave2, stave3, stave4].forEach(s => s.setContext(context).draw());
      
      VF.Formatter.FormatAndDraw(context, stave1, notes1);
      VF.Formatter.FormatAndDraw(context, stave2, notes2);
      VF.Formatter.FormatAndDraw(context, stave3, notes3);
      VF.Formatter.FormatAndDraw(context, stave4, notes4);

      // 上段の連桁(ビーム)
      VF.Beam.generateBeams(notes1).forEach(b => b.setContext(context).draw());
      VF.Beam.generateBeams(notes2).forEach(b => b.setContext(context).draw());
      VF.Beam.generateBeams(notes3).forEach(b => b.setContext(context).draw());
      VF.Beam.generateBeams(notes4).forEach(b => b.setContext(context).draw());

      // 【5〜8小節目】(下段)
      const stave5 = new VF.Stave(10, 150, 240).addClef("percussion");
      const stave6 = new VF.Stave(stave5.width + stave5.x, 150, 190);
      const stave7 = new VF.Stave(stave6.width + stave6.x, 150, 190);
      const stave8 = new VF.Stave(stave7.width + stave7.x, 150, 200);
      
      // Bar 5: Snare on 3
      const notes5 = [ n(["b/4"], "hr"), n(["c/5"], "q"), n(["b/4"], "qr") ];
      // Bar 6: Kick on 2-and, Snare on 4-and
      const notes6 = [ n(["b/4"], "qr"), n(["b/4"], "8r"), n(["f/4"], "8"), n(["b/4"], "qr"), n(["b/4"], "8r"), n(["c/5"], "8") ];
      // Bar 7: Kick on 1-and, Snare on 3-and
      const notes7 = [ n(["b/4"], "8r"), n(["f/4"], "8"), n(["b/4"], "qr"), n(["b/4"], "8r"), n(["c/5"], "8"), n(["b/4"], "qr") ];
      // Bar 8 (Fill): Dropping Bombs (16th Snare on 1 & 3, Kick on 2 & 4)
      const notes8 = [ 
        n(["c/5"], "16"), n(["c/5"], "16"), n(["c/5"], "16"), n(["c/5"], "16"), // Beat 1
        n(["f/4"], "q"), // Beat 2
        n(["c/5"], "16"), n(["c/5"], "16"), n(["c/5"], "16"), n(["c/5"], "16"), // Beat 3
        n(["f/4"], "q")  // Beat 4
      ];

      [stave5, stave6, stave7, stave8].forEach(s => s.setContext(context).draw());

      VF.Formatter.FormatAndDraw(context, stave5, notes5);
      VF.Formatter.FormatAndDraw(context, stave6, notes6);
      VF.Formatter.FormatAndDraw(context, stave7, notes7);
      VF.Formatter.FormatAndDraw(context, stave8, notes8);

      // 下段の連桁(ビーム)
      VF.Beam.generateBeams(notes5).forEach(b => b.setContext(context).draw());
      VF.Beam.generateBeams(notes6).forEach(b => b.setContext(context).draw());
      VF.Beam.generateBeams(notes7).forEach(b => b.setContext(context).draw());
      VF.Beam.generateBeams(notes8).forEach(b => b.setContext(context).draw());
    }

    // 初期描画
    drawScore();

  </script>
</body>
</html>
