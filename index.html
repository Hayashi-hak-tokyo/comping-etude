<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jazz Drummer's Etude</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vexflow/3.0.9/vexflow-min.js"></script>
  <style>
    body { background-color: #fdfcf8; color: #1a1a1a; font-family: 'Inter', serif; }
    .book-page {
      background-color: #ffffff;
      border: 1px solid #e5e5e5;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
    }
    .active-bar { background-color: #3b82f6; color: white; border-color: #3b82f6; }
    .fill-bar { background-color: #ef4444; color: white; border-color: #ef4444; }
    #score-container svg { max-width: 100%; height: auto; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4">

  <div class="max-w-4xl w-full space-y-6">
    
    <!-- ヘッダー -->
    <div class="text-center border-b-2 border-gray-200 pb-6 mb-8">
      <h1 class="text-4xl font-bold tracking-tight text-gray-900" style="font-family: 'Times New Roman', Times, serif;">Beyond Bop Etude</h1>
      <p class="text-gray-500 mt-2 font-medium">Practice Snare & Kick Phrases (Fixed or Random)</p>
    </div>

    <!-- コントロールパネル -->
    <div class="book-page p-6 rounded-xl flex flex-col gap-6">
      
      <div class="flex flex-col md:flex-row items-center gap-6 w-full">
        <div class="flex-1 w-full space-y-2">
          <div class="flex justify-between items-end">
            <span class="font-bold text-gray-700 text-sm uppercase tracking-wider">Metronome (BPM)</span>
            <span id="bpm-display" class="font-bold text-3xl text-blue-600">120</span>
          </div>
          <input type="range" id="bpm-slider" min="60" max="250" step="1" value="120" class="w-full accent-blue-600 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" />
        </div>

        <button id="play-btn" class="w-full md:w-48 py-4 rounded-xl font-bold text-lg text-white bg-blue-600 hover:bg-blue-700 transition-all shadow-md">
          START CLICK
        </button>
      </div>

      <!-- モード選択とフレーズ選択 -->
      <div class="flex flex-col md:flex-row gap-4 border-t pt-4 border-gray-100 items-end">
        <div class="flex-1 w-full">
          <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Practice Mode</label>
          <select id="mode-select" class="w-full p-2 border border-gray-300 rounded-lg bg-white text-gray-700 font-medium focus:outline-none focus:border-blue-500">
            <option value="fixed">Fixed Pattern (Loop)</option>
            <option value="random">Random Pattern (Auto-change)</option>
          </select>
        </div>
        <div class="flex-1 w-full">
          <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Select Pattern</label>
          <select id="pattern-select" class="w-full p-2 border border-gray-300 rounded-lg bg-white text-gray-700 font-medium focus:outline-none focus:border-blue-500">
            <option value="0">1. Syncopation & Bombs</option>
            <option value="1">2. 3-Beat Comping & Triplets</option>
            <option value="2">3. Broken Time (Sparse)</option>
            <option value="3">4. Offbeat Kicks & Snare</option>
          </select>
        </div>
        <div class="flex-1 w-full">
          <button id="regenerate-btn" class="w-full p-2 border-2 border-blue-500 rounded-lg bg-blue-50 text-blue-700 font-bold hover:bg-blue-100 transition-colors shadow-sm">
            REGENERATE 🎲
          </button>
        </div>
      </div>

    </div>

    <!-- 小節トラッカー -->
    <div class="book-page p-5 rounded-xl space-y-3">
      <div class="flex justify-between items-center px-1">
        <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Phrase Tracker</span>
        <div class="flex items-center gap-4">
          <div id="beat-display" class="bg-[#3a3a3a] text-white font-mono font-bold text-lg px-3 py-1 rounded-md shadow-md tracking-widest">1-1</div>
          <span id="status-text" class="text-xs font-bold text-blue-600 uppercase">Ready</span>
        </div>
      </div>
    </div>

    <!-- 楽譜表示エリア -->
    <div class="book-page p-6 rounded-xl flex flex-col items-center overflow-x-auto">
      <div id="score-container" class="w-full flex justify-center min-w-[800px]"></div>
      <p class="text-sm text-gray-500 mt-6 text-center">※ライドとハイハットは4/4ジャズパターンをキープし、スネア(上段)とキック(下段)を演奏してください。</p>
    </div>

  </div>

  <script>
    // --- フレーズのデータ定義 (Beyond Bop Drumming p.17, 19, 39, 47等に準拠) ---
    const patterns = [
      {
        name: "Page 19 (Elvin's Comping) + Page 47 (3-Beat Fill)",
        scoreNotes: [
          // Bars 1-7: Elvin Jones "All or Nothing At All" (p.19) スタイル。スネアとバスドラムの対話
          [ {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"}, {k:["b/4"],d:"qr"}, {k:["c/5"],d:"q"} ],
          [ {k:["b/4"],d:"qr"}, {k:["f/4"],d:"8"}, {k:["b/4"],d:"8r"}, {k:["b/4"],d:"qr"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"8r"} ],
          [ {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["f/4"],d:"q"}, {k:["b/4"],d:"qr"}, {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"} ],
          [ {k:["f/4"],d:"q"}, {k:["b/4"],d:"qr"}, {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["f/4"],d:"q"} ],
          [ {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"8r"}, {k:["b/4"],d:"qr"}, {k:["f/4"],d:"q"} ],
          [ {k:["c/5"],d:"q"}, {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"}, {k:["c/5"],d:"q"}, {k:["b/4"],d:"qr"} ],
          [ {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"}, {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["f/4"],d:"q"}, {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"} ],
          // Bar 8: 3-Beat Phrases (p.47). 4/4の中で3拍の固まり(付点4分音符相当)を連続させる
          [ {k:["c/5"],d:"8"}, {k:["c/5"],d:"8"}, {k:["f/4"],d:"8"}, {k:["c/5"],d:"8"}, {k:["c/5"],d:"8"}, {k:["f/4"],d:"8"}, {k:["c/5"],d:"q"} ]
        ],
        beams: [
          [{start:0, end:1}, {start:2, end:3}], [{start:1, end:2}, {start:4, end:5}], [{start:0, end:1}, {start:4, end:5}], [{start:2, end:3}],
          [{start:0, end:1}, {start:2, end:3}], [{start:1, end:2}], [{start:0, end:1}, {start:2, end:3}, {start:5, end:6}],
          [{start:0, end:2}, {start:3, end:5}] // 3連符的なまとまり(3-beat)
        ],
        play: (bar, beat, time, upbeat, snare, kick) => {
          if (bar === 1) { if(beat===0) snare.triggerAttackRelease("16n", time+upbeat); if(beat===1) kick.triggerAttackRelease("C1", "8n", time+upbeat); if(beat===3) snare.triggerAttackRelease("16n", time); }
          if (bar === 2) { if(beat===1) kick.triggerAttackRelease("C1", "8n", time); if(beat===3) snare.triggerAttackRelease("16n", time); }
          if (bar === 3) { if(beat===0) snare.triggerAttackRelease("16n", time+upbeat); if(beat===1) kick.triggerAttackRelease("C1", "8n", time); if(beat===3) kick.triggerAttackRelease("C1", "8n", time+upbeat); }
          if (bar === 4) { if(beat===0) kick.triggerAttackRelease("C1", "8n", time); if(beat===2) snare.triggerAttackRelease("16n", time+upbeat); if(beat===3) kick.triggerAttackRelease("C1", "8n", time); }
          if (bar === 5) { if(beat===0) kick.triggerAttackRelease("C1", "8n", time+upbeat); if(beat===1) snare.triggerAttackRelease("16n", time); if(beat===3) kick.triggerAttackRelease("C1", "8n", time); }
          if (bar === 6) { if(beat===0) snare.triggerAttackRelease("16n", time); if(beat===1) kick.triggerAttackRelease("C1", "8n", time+upbeat); if(beat===2) snare.triggerAttackRelease("16n", time); }
          if (bar === 7) { if(beat===0) kick.triggerAttackRelease("C1", "8n", time+upbeat); if(beat===1) snare.triggerAttackRelease("16n", time+upbeat); if(beat===2) kick.triggerAttackRelease("C1", "8n", time); if(beat===3) snare.triggerAttackRelease("16n", time+upbeat); }
          if (bar === 8) {
            const eighth = Tone.Time("8n").toSeconds();
            if(beat===0) { snare.triggerAttackRelease("16n", time); snare.triggerAttackRelease("16n", time+eighth); kick.triggerAttackRelease("C1", "8n", time+eighth*2); }
            if(beat===1 && beat===2) { snare.triggerAttackRelease("16n", time+eighth); snare.triggerAttackRelease("16n", time+eighth*2); kick.triggerAttackRelease("C1", "8n", time+eighth*3); }
            if(beat===3) { snare.triggerAttackRelease("16n", time); } // Resolution
          }
        }
      },
      {
        name: "Page 17 (3-Voice in Triplets) + Page 47 (Groups of 4)",
        scoreNotes: [
          // Bars 1-7: Page 17 - 3-Voice Comping in Triplets (Snare & Kick)
          [ {k:["c/5"],d:"8"}, {k:["b/4"],d:"8r"}, {k:["f/4"],d:"q"}, {k:["b/4"],d:"qr"}, {k:["c/5"],d:"q"} ],
          [ {k:["b/4"],d:"qr"}, {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"8r"}, {k:["f/4"],d:"q"} ],
          [ {k:["f/4"],d:"q"}, {k:["c/5"],d:"q"}, {k:["b/4"],d:"hr"} ],
          [ {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"}, {k:["b/4"],d:"qr"}, {k:["c/5"],d:"q"} ],
          [ {k:["b/4"],d:"qr"}, {k:["c/5"],d:"q"}, {k:["f/4"],d:"q"}, {k:["b/4"],d:"qr"} ],
          [ {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"}, {k:["c/5"],d:"q"}, {k:["b/4"],d:"qr"}, {k:["f/4"],d:"q"} ],
          [ {k:["c/5"],d:"8"}, {k:["b/4"],d:"8r"}, {k:["b/4"],d:"qr"}, {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"}, {k:["c/5"],d:"q"} ],
          // Bar 8: Triplets in Groups of 4 (p.47). 16分音符の4つ割り
          [ {k:["c/5"],d:"16"},{k:["c/5"],d:"16"},{k:["f/4"],d:"16"},{k:["f/4"],d:"16"}, {k:["c/5"],d:"16"},{k:["c/5"],d:"16"},{k:["f/4"],d:"16"},{k:["f/4"],d:"16"}, {k:["c/5"],d:"q"}, {k:["f/4"],d:"q"} ]
        ],
        beams: [
          [{start:0, end:1}], [{start:1, end:2}, {start:3, end:4}], [], [{start:0, end:1}, {start:2, end:3}], [], [{start:0, end:1}], [{start:0, end:1}, {start:3, end:4}],
          [{start:0, end:3}, {start:4, end:7}] // 4つ割り16分
        ],
        play: (bar, beat, time, upbeat, snare, kick) => {
          if (bar === 1) { if(beat===0) snare.triggerAttackRelease("16n", time); if(beat===1) kick.triggerAttackRelease("C1", "8n", time); if(beat===3) snare.triggerAttackRelease("16n", time); }
          if (bar === 2) { if(beat===1) kick.triggerAttackRelease("C1", "8n", time+upbeat); if(beat===2) snare.triggerAttackRelease("16n", time); if(beat===3) kick.triggerAttackRelease("C1", "8n", time); }
          if (bar === 3) { if(beat===0) kick.triggerAttackRelease("C1", "8n", time); if(beat===1) snare.triggerAttackRelease("16n", time); }
          if (bar === 4) { if(beat===0) snare.triggerAttackRelease("16n", time+upbeat); if(beat===1) kick.triggerAttackRelease("C1", "8n", time+upbeat); if(beat===3) snare.triggerAttackRelease("16n", time); }
          if (bar === 5) { if(beat===1) snare.triggerAttackRelease("16n", time); if(beat===2) kick.triggerAttackRelease("C1", "8n", time); }
          if (bar === 6) { if(beat===0) kick.triggerAttackRelease("C1", "8n", time+upbeat); if(beat===1) snare.triggerAttackRelease("16n", time); if(beat===3) kick.triggerAttackRelease("C1", "8n", time); }
          if (bar === 7) { if(beat===0) snare.triggerAttackRelease("16n", time); if(beat===2) kick.triggerAttackRelease("C1", "8n", time+upbeat); if(beat===3) snare.triggerAttackRelease("16n", time); }
          if (bar === 8) {
            const sixteenth = Tone.Time("4n").toSeconds() / 4;
            if(beat===0 || beat===1) {
              snare.triggerAttackRelease("16n", time); snare.triggerAttackRelease("16n", time+sixteenth);
              kick.triggerAttackRelease("C1", "8n", time+sixteenth*2); kick.triggerAttackRelease("C1", "8n", time+sixteenth*3);
            }
            if(beat===2) snare.triggerAttackRelease("16n", time);
            if(beat===3) kick.triggerAttackRelease("C1", "8n", time);
          }
        }
      },
      {
        name: "Page 10 (8th-note Comping) + Page 39 (Odd Groups)",
        scoreNotes: [
          // Bars 1-7: Basic 8th-note syncopation
          [ {k:["b/4"],d:"qr"}, {k:["f/4"],d:"8"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"qr"}, {k:["f/4"],d:"q"} ],
          [ {k:["c/5"],d:"q"}, {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"}, {k:["c/5"],d:"q"}, {k:["b/4"],d:"qr"} ],
          [ {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"qr"}, {k:["f/4"],d:"q"}, {k:["b/4"],d:"qr"} ],
          [ {k:["b/4"],d:"qr"}, {k:["c/5"],d:"8"}, {k:["f/4"],d:"8"}, {k:["b/4"],d:"hr"} ],
          [ {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"}, {k:["c/5"],d:"q"}, {k:["b/4"],d:"qr"}, {k:["f/4"],d:"q"} ],
          [ {k:["b/4"],d:"qr"}, {k:["c/5"],d:"q"}, {k:["f/4"],d:"8"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"qr"} ],
          [ {k:["f/4"],d:"q"}, {k:["b/4"],d:"qr"}, {k:["c/5"],d:"q"}, {k:["f/4"],d:"q"} ],
          // Bar 8: Odd Groups (p.39) 5連符的なニュアンス
          [ {k:["c/5"],d:"16"},{k:["c/5"],d:"16"},{k:["c/5"],d:"16"},{k:["f/4"],d:"16"},{k:["f/4"],d:"16"}, {k:["b/4"],d:"16r"},{k:["b/4"],d:"16r"},{k:["b/4"],d:"16r"}, {k:["c/5"],d:"q"}, {k:["f/4"],d:"q"} ]
        ],
        beams: [
          [{start:1, end:2}], [{start:1, end:2}], [{start:0, end:1}], [{start:1, end:2}], [{start:0, end:1}], [{start:2, end:3}], [],
          [{start:0, end:4}]
        ],
        play: (bar, beat, time, upbeat, snare, kick) => {
          if (bar === 1) { if(beat===1) { kick.triggerAttackRelease("C1", "8n", time); snare.triggerAttackRelease("16n", time+upbeat); } if(beat===3) kick.triggerAttackRelease("C1", "8n", time); }
          if (bar === 2) { if(beat===0) snare.triggerAttackRelease("16n", time); if(beat===1) kick.triggerAttackRelease("C1", "8n", time+upbeat); if(beat===2) snare.triggerAttackRelease("16n", time); }
          if (bar === 3) { if(beat===0) snare.triggerAttackRelease("16n", time+upbeat); if(beat===2) kick.triggerAttackRelease("C1", "8n", time); }
          if (bar === 4) { if(beat===1) { snare.triggerAttackRelease("16n", time); kick.triggerAttackRelease("C1", "8n", time+upbeat); } }
          if (bar === 5) { if(beat===0) kick.triggerAttackRelease("C1", "8n", time+upbeat); if(beat===1) snare.triggerAttackRelease("16n", time); if(beat===3) kick.triggerAttackRelease("C1", "8n", time); }
          if (bar === 6) { if(beat===1) snare.triggerAttackRelease("16n", time); if(beat===2) { kick.triggerAttackRelease("C1", "8n", time); snare.triggerAttackRelease("16n", time+upbeat); } }
          if (bar === 7) { if(beat===0) kick.triggerAttackRelease("C1", "8n", time); if(beat===2) snare.triggerAttackRelease("16n", time); if(beat===3) kick.triggerAttackRelease("C1", "8n", time); }
          if (bar === 8) {
            const sixteenth = Tone.Time("4n").toSeconds() / 4;
            if(beat===0) { snare.triggerAttackRelease("16n", time); snare.triggerAttackRelease("16n", time+sixteenth); snare.triggerAttackRelease("16n", time+sixteenth*2); kick.triggerAttackRelease("C1", "8n", time+sixteenth*3); }
            if(beat===1) { kick.triggerAttackRelease("C1", "8n", time); }
            if(beat===2) { snare.triggerAttackRelease("16n", time); }
            if(beat===3) { kick.triggerAttackRelease("C1", "8n", time); }
          }
        }
      },
      {
        name: "Page 13 (DeJohnette) + Page 46 (Variable Speed)",
        scoreNotes: [
          // Bars 1-7: Unbroken flow, sparse comping
          [ {k:["b/4"],d:"qr"}, {k:["b/4"],d:"qr"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"8r"}, {k:["f/4"],d:"q"} ],
          [ {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["f/4"],d:"q"}, {k:["b/4"],d:"hr"} ],
          [ {k:["b/4"],d:"hr"}, {k:["f/4"],d:"q"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"8r"} ],
          [ {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"}, {k:["c/5"],d:"q"}, {k:["b/4"],d:"qr"} ],
          [ {k:["f/4"],d:"8"}, {k:["b/4"],d:"8r"}, {k:["b/4"],d:"qr"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"8r"}, {k:["f/4"],d:"q"} ],
          [ {k:["b/4"],d:"qr"}, {k:["f/4"],d:"q"}, {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"qr"} ],
          [ {k:["c/5"],d:"q"}, {k:["b/4"],d:"qr"}, {k:["f/4"],d:"q"}, {k:["c/5"],d:"q"} ],
          // Bar 8: Variable Speed Phrase (p.46)
          [ {k:["c/5"],d:"8"}, {k:["f/4"],d:"8"}, {k:["c/5"],d:"16"},{k:["c/5"],d:"16"},{k:["f/4"],d:"16"},{k:["f/4"],d:"16"}, {k:["c/5"],d:"8"}, {k:["f/4"],d:"8"}, {k:["c/5"],d:"q"} ]
        ],
        beams: [
          [{start:2, end:3}], [{start:0, end:1}], [{start:2, end:3}], [{start:0, end:1}, {start:2, end:3}], [{start:0, end:1}, {start:3, end:4}], [{start:2, end:3}], [],
          [{start:0, end:1}, {start:2, end:5}, {start:6, end:7}]
        ],
        play: (bar, beat, time, upbeat, snare, kick) => {
          if (bar === 1) { if(beat===2) snare.triggerAttackRelease("16n", time); if(beat===3) kick.triggerAttackRelease("C1", "8n", time); }
          if (bar === 2) { if(beat===0) snare.triggerAttackRelease("16n", time+upbeat); if(beat===1) kick.triggerAttackRelease("C1", "8n", time); }
          if (bar === 3) { if(beat===2) kick.triggerAttackRelease("C1", "8n", time); if(beat===3) snare.triggerAttackRelease("16n", time); }
          if (bar === 4) { if(beat===0) snare.triggerAttackRelease("16n", time+upbeat); if(beat===1) kick.triggerAttackRelease("C1", "8n", time+upbeat); if(beat===2) snare.triggerAttackRelease("16n", time); }
          if (bar === 5) { if(beat===0) kick.triggerAttackRelease("C1", "8n", time); if(beat===2) snare.triggerAttackRelease("16n", time); if(beat===3) kick.triggerAttackRelease("C1", "8n", time); }
          if (bar === 6) { if(beat===1) kick.triggerAttackRelease("C1", "8n", time); if(beat===2) snare.triggerAttackRelease("16n", time+upbeat); }
          if (bar === 7) { if(beat===0) snare.triggerAttackRelease("16n", time); if(beat===2) kick.triggerAttackRelease("C1", "8n", time); if(beat===3) snare.triggerAttackRelease("16n", time); }
          if (bar === 8) {
            const sixteenth = Tone.Time("4n").toSeconds() / 4;
            if(beat===0) { snare.triggerAttackRelease("16n", time); kick.triggerAttackRelease("C1", "8n", time+sixteenth*2); }
            if(beat===1) { snare.triggerAttackRelease("16n", time); snare.triggerAttackRelease("16n", time+sixteenth); kick.triggerAttackRelease("C1", "8n", time+sixteenth*2); kick.triggerAttackRelease("C1", "8n", time+sixteenth*3); }
            if(beat===2) { snare.triggerAttackRelease("16n", time); kick.triggerAttackRelease("C1", "8n", time+sixteenth*2); }
            if(beat===3) { snare.triggerAttackRelease("16n", time); }
          }
        }
      }
    ];

    // --- State Variables ---
    let isPlaying = false;
    let currentBpm = 120;
    let currentPatternIndex = 0;
    let isRandomMode = false;
    
    // --- UI Elements ---
    const playBtn = document.getElementById('play-btn');
    const bpmSlider = document.getElementById('bpm-slider');
    const bpmDisplay = document.getElementById('bpm-display');
    const statusText = document.getElementById('status-text');
    const beatDisplay = document.getElementById('beat-display');
    const modeSelect = document.getElementById('mode-select');
    const patternSelect = document.getElementById('pattern-select');
    const regenerateBtn = document.getElementById('regenerate-btn');

    // イベントリスナー
    modeSelect.addEventListener('change', (e) => {
      isRandomMode = e.target.value === 'random';
      patternSelect.disabled = isRandomMode;
    });
    
    patternSelect.addEventListener('change', (e) => {
      currentPatternIndex = parseInt(e.target.value, 10);
      if(!isPlaying) drawScore();
    });

    regenerateBtn.addEventListener('click', () => {
      currentPatternIndex = Math.floor(Math.random() * patterns.length);
      patternSelect.value = currentPatternIndex;
      drawScore();
    });

    bpmSlider.addEventListener('input', (e) => {
      currentBpm = Number(e.target.value);
      bpmDisplay.textContent = currentBpm;
      if (Tone.Transport.state === "started") Tone.Transport.bpm.value = currentBpm;
    });

    // --- Audio Setup ---
    let clickHigh, clickLow, kick, snare;
    function initAudio() {
      if(clickHigh) return;
      clickHigh = new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.01 }, volume: -5 }).toDestination();
      clickLow = new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.01 }, volume: -10 }).toDestination();
      kick = new Tone.MembraneSynth({ volume: 2 }).toDestination();
      snare = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.2, sustain: 0 }, volume: 0 }).toDestination();
    }

    // --- Playback Logic ---
    async function togglePlayback() {
      if (isPlaying) {
        Tone.Transport.stop();
        Tone.Transport.cancel();
        isPlaying = false;
        playBtn.textContent = "START CLICK";
        playBtn.className = "w-full md:w-48 py-4 rounded-xl font-bold text-lg text-white bg-blue-600 hover:bg-blue-700 transition-all shadow-md";
        statusText.textContent = "Ready";
        beatDisplay.textContent = "1-1";
      } else {
        await Tone.start();
        initAudio();
        Tone.Transport.bpm.value = currentBpm;

        let barCount = 1;
        let beatCount = 0;

        if(isRandomMode) {
          currentPatternIndex = Math.floor(Math.random() * patterns.length);
          patternSelect.value = currentPatternIndex;
          Tone.Draw.schedule(() => drawScore(), Tone.now());
        }

        Tone.Transport.scheduleRepeat((time) => {
          const quarter = Tone.Time("4n").toSeconds();
          const upbeat = quarter * 0.67; // スイングフィール

          // メトロノーム
          if (beatCount === 0) clickHigh.triggerAttackRelease("A5", "32n", time, 0.5);
          else clickLow.triggerAttackRelease("A4", "32n", time, 0.5);

          // フレーズの再生
          patterns[currentPatternIndex].play(barCount, beatCount, time, upbeat, snare, kick);

          // UI Update
          Tone.Draw.schedule(() => {
            beatDisplay.textContent = `${barCount}-${beatCount + 1}`;

            if (beatCount === 0) {
              if (barCount === 8) {
                statusText.textContent = "Bar 8: Fill-in";
                statusText.className = "text-xs font-bold text-red-500 uppercase tracking-wider";
              } else {
                statusText.textContent = `Bar ${barCount}: Comping`;
                statusText.className = "text-xs font-bold text-blue-600 uppercase tracking-wider";
              }
            }
          }, time);

          beatCount++;
          if (beatCount > 3) {
            beatCount = 0;
            barCount++;
            if (barCount > 8) {
              barCount = 1; // ループ
              // ランダムモードの場合はパターン変更
              if(isRandomMode) {
                currentPatternIndex = Math.floor(Math.random() * patterns.length);
                patternSelect.value = currentPatternIndex;
                Tone.Draw.schedule(() => drawScore(), time + quarter); // 次の小節の頭で描画
              }
            }
          }
        }, "4n");

        Tone.Transport.start();
        isPlaying = true;
        playBtn.textContent = "STOP";
        playBtn.className = "w-full md:w-48 py-4 rounded-xl font-bold text-lg text-red-600 bg-red-100 hover:bg-red-200 transition-all shadow-md";
      }
    }
    playBtn.addEventListener('click', togglePlayback);

    // --- VexFlow Drawing ---
    function drawScore() {
      const VF = Vex.Flow;
      const container = document.getElementById("score-container");
      container.innerHTML = ""; 

      const renderer = new VF.Renderer(container, VF.Renderer.Backends.SVG);
      renderer.resize(950, 300);
      const context = renderer.getContext();

      const pattern = patterns[currentPatternIndex];
      const staves = [];
      const vfNotes = [];

      let currentX = 10;
      let currentY = 20;

      // Create Staves (4 bars top, 4 bars bottom)
      for(let i=0; i<8; i++) {
        // 5小節目で改段
        if (i === 4) {
          currentX = 10;
          currentY = 150;
        }
        
        let isStartOfLine = (i === 0 || i === 4);
        let width = isStartOfLine ? 240 : 220;
        
        const stave = new VF.Stave(currentX, currentY, width);
        
        if(isStartOfLine) {
          stave.addClef("percussion").addTimeSignature("4/4");
          // 段の頭の開始線を通常の単一線に設定
          stave.setBegBarType(VF.Barline.type.SINGLE);
        } else {
          // 2小節目以降は左端の開始線を描画しない
          stave.setBegBarType(VF.Barline.type.NONE);
        }

        // 4小節目と8小節目の終わりに終了線を引く
        if (i === 3 || i === 7) {
          stave.setEndBarType(VF.Barline.type.END);
        }

        staves.push(stave);
        currentX += width;

        // Create Notes for this bar
        const barData = pattern.scoreNotes[i];
        const notes = barData.map(nd => new VF.StaveNote({ clef: "percussion", keys: nd.k, duration: nd.d }));
        vfNotes.push(notes);
      }

      // Draw Staves and Notes
      for(let i=0; i<8; i++) {
        staves[i].setContext(context).draw();
        VF.Formatter.FormatAndDraw(context, staves[i], vfNotes[i]);

        // Draw Beams
        const barBeams = pattern.beams[i];
        if (barBeams && barBeams.length > 0) {
          barBeams.forEach(b => {
             const beamNotes = vfNotes[i].slice(b.start, b.end + 1);
             new VF.Beam(beamNotes).setContext(context).draw();
          });
        }
      }
    }

    // Initial draw
    drawScore();
  </script>
</body>
