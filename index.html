<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jazz Drummer's Etude</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vexflow/3.0.9/vexflow-min.js"></script>
  <style>
    body { background-color: #fdfcf8; color: #1a1a1a; font-family: 'Inter', serif; }
    .book-page {
      background-color: #ffffff;
      border: 1px solid #e5e5e5;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
    }
    .active-bar { background-color: #3b82f6; color: white; border-color: #3b82f6; }
    .fill-bar { background-color: #ef4444; color: white; border-color: #ef4444; }
    #score-container svg { max-width: 100%; height: auto; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4">

  <div class="max-w-4xl w-full space-y-6">
    
    <!-- ヘッダー -->
    <div class="text-center border-b-2 border-gray-200 pb-6 mb-8">
      <h1 class="text-4xl font-bold tracking-tight text-gray-900" style="font-family: 'Times New Roman', Times, serif;">Beyond Bop Etude</h1>
      <p class="text-gray-500 mt-2 font-medium">Practice Snare & Kick Phrases (Fixed or Random)</p>
    </div>

    <!-- コントロールパネル -->
    <div class="book-page p-6 rounded-xl flex flex-col gap-6">
      
      <div class="flex flex-col md:flex-row items-center gap-6 w-full">
        <div class="flex-1 w-full space-y-2">
          <div class="flex justify-between items-end">
            <span class="font-bold text-gray-700 text-sm uppercase tracking-wider">Metronome (BPM)</span>
            <span id="bpm-display" class="font-bold text-3xl text-blue-600">120</span>
          </div>
          <input type="range" id="bpm-slider" min="60" max="250" step="1" value="120" class="w-full accent-blue-600 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" />
        </div>

        <button id="play-btn" class="w-full md:w-48 py-4 rounded-xl font-bold text-lg text-white bg-blue-600 hover:bg-blue-700 transition-all shadow-md">
          START CLICK
        </button>
      </div>

      <!-- モード選択とフレーズ選択 -->
      <div class="flex flex-col md:flex-row gap-4 border-t pt-4 border-gray-100">
        <div class="flex-1">
          <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Practice Mode</label>
          <select id="mode-select" class="w-full p-2 border border-gray-300 rounded-lg bg-white text-gray-700 font-medium focus:outline-none focus:border-blue-500">
            <option value="fixed">Fixed Pattern (Loop)</option>
            <option value="random">Random Pattern (Changes every 8 bars)</option>
          </select>
        </div>
        <div class="flex-1">
          <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Select Pattern (Fixed Mode only)</label>
          <select id="pattern-select" class="w-full p-2 border border-gray-300 rounded-lg bg-white text-gray-700 font-medium focus:outline-none focus:border-blue-500">
            <option value="0">Pattern 1: Syncopation & Bombs</option>
            <option value="1">Pattern 2: 3-Beat Comping & Triplets</option>
          </select>
        </div>
      </div>

    </div>

    <!-- 小節トラッカー -->
    <div class="book-page p-5 rounded-xl space-y-3">
      <div class="flex justify-between items-center px-1">
        <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Phrase Tracker</span>
        <div class="flex items-center gap-4">
          <div id="beat-display" class="bg-[#3a3a3a] text-white font-mono font-bold text-lg px-3 py-1 rounded-md shadow-md tracking-widest">1-1</div>
          <span id="status-text" class="text-xs font-bold text-blue-600 uppercase">Ready</span>
        </div>
      </div>
      <div class="grid grid-cols-8 gap-2" id="bar-tracker">
        <!-- JSで生成 -->
      </div>
    </div>

    <!-- 楽譜表示エリア -->
    <div class="book-page p-6 rounded-xl flex flex-col items-center overflow-x-auto">
      <div id="score-container" class="w-full flex justify-center min-w-[800px]"></div>
      <p class="text-sm text-gray-500 mt-6 text-center">※ライドとハイハットは4/4ジャズパターンをキープし、スネア(上段)とキック(下段)を演奏してください。</p>
    </div>

  </div>

  <script>
    // --- フレーズのデータ定義 ---
    // VF生成ヘルパー内で使うためにデータを文字列で定義
    const patterns = [
      {
        name: "Syncopation & Bombs",
        scoreNotes: [
          // Bar 1-4
          [ {k:["b/4"],d:"qr"}, {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"qr"}, {k:["f/4"],d:"q"} ],
          [ {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"}, {k:["b/4"],d:"qr"}, {k:["c/5"],d:"q"}, {k:["b/4"],d:"qr"} ],
          [ {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"}, {k:["b/4"],d:"qr"}, {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"} ],
          [ {k:["b/4"],d:"hr"}, {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"}, {k:["c/5"],d:"q"} ],
          // Bar 5-8
          [ {k:["b/4"],d:"qr"}, {k:["f/4"],d:"q"}, {k:["c/5"],d:"q"}, {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"} ],
          [ {k:["c/5"],d:"q"}, {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"qr"}, {k:["f/4"],d:"q"} ],
          [ {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"qr"}, {k:["f/4"],d:"q"}, {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"} ],
          // Fill: 16ths snare on 1 & 3, kick on 2 & 4
          [ {k:["c/5"],d:"16"},{k:["c/5"],d:"16"},{k:["c/5"],d:"16"},{k:["c/5"],d:"16"}, {k:["f/4"],d:"q"}, {k:["c/5"],d:"16"},{k:["c/5"],d:"16"},{k:["c/5"],d:"16"},{k:["c/5"],d:"16"}, {k:["f/4"],d:"q"} ]
        ],
        // 描画時のビーム指定 (各小節)
        beams: [
          [{start:1, end:2}], // Bar 1
          [{start:0, end:1}], // Bar 2
          [{start:0, end:1}, {start:2, end:3}, {start:5, end:6}], // Bar 3
          [{start:1, end:2}], // Bar 4
          [{start:3, end:4}], // Bar 5
          [{start:1, end:2}], // Bar 6
          [{start:0, end:1}, {start:4, end:5}], // Bar 7
          [{start:0, end:3}, {start:5, end:8}]  // Bar 8 (16分音符の塊ごと)
        ],
        // Tone.js 再生用ロジック
        play: (bar, beat, time, upbeat, snare, kick) => {
          const sixteenth = Tone.Time("4n").toSeconds() / 4;
          if (bar === 1) { if(beat===1) snare.triggerAttackRelease("16n", time+upbeat, 0.8); if(beat===3) kick.triggerAttackRelease("C1", "8n", time, 1.0); }
          if (bar === 2) { if(beat===0) kick.triggerAttackRelease("C1", "8n", time+upbeat, 1.0); if(beat===2) snare.triggerAttackRelease("16n", time, 0.8); }
          if (bar === 3) { if(beat===0) snare.triggerAttackRelease("16n", time+upbeat, 0.8); if(beat===1) kick.triggerAttackRelease("C1", "8n", time+upbeat, 1.0); if(beat===3) snare.triggerAttackRelease("16n", time+upbeat, 0.8); }
          if (bar === 4) { if(beat===2) kick.triggerAttackRelease("C1", "8n", time+upbeat, 1.0); if(beat===3) snare.triggerAttackRelease("16n", time, 0.8); }
          if (bar === 5) { if(beat===1) kick.triggerAttackRelease("C1", "8n", time, 1.0); if(beat===2) snare.triggerAttackRelease("16n", time, 0.8); if(beat===3) kick.triggerAttackRelease("C1", "8n", time+upbeat, 1.0); }
          if (bar === 6) { if(beat===0) snare.triggerAttackRelease("16n", time, 0.8); if(beat===1) snare.triggerAttackRelease("16n", time+upbeat, 0.8); if(beat===3) kick.triggerAttackRelease("C1", "8n", time, 1.0); }
          if (bar === 7) { if(beat===0) snare.triggerAttackRelease("16n", time+upbeat, 0.8); if(beat===2) kick.triggerAttackRelease("C1", "8n", time, 1.0); if(beat===3) snare.triggerAttackRelease("16n", time+upbeat, 0.8); }
          if (bar === 8) {
            if(beat===0 || beat===2) { snare.triggerAttackRelease("16n", time); snare.triggerAttackRelease("16n", time+sixteenth); snare.triggerAttackRelease("16n", time+sixteenth*2); snare.triggerAttackRelease("16n", time+sixteenth*3); }
            if(beat===1 || beat===3) { kick.triggerAttackRelease("C1", "8n", time, 1.2); }
          }
        }
      },
      {
        name: "3-Beat Comping & Triplets",
        scoreNotes: [
          // Bar 1-4: 3-beat cross rhythm idea
          [ {k:["c/5"],d:"q"}, {k:["b/4"],d:"qr"}, {k:["f/4"],d:"q"}, {k:["b/4"],d:"qr"} ],
          [ {k:["b/4"],d:"qr"}, {k:["c/5"],d:"q"}, {k:["b/4"],d:"qr"}, {k:["f/4"],d:"q"} ],
          [ {k:["b/4"],d:"qr"}, {k:["b/4"],d:"qr"}, {k:["c/5"],d:"q"}, {k:["b/4"],d:"qr"} ],
          [ {k:["f/4"],d:"q"}, {k:["b/4"],d:"qr"}, {k:["c/5"],d:"q"}, {k:["b/4"],d:"qr"} ],
          // Bar 5-8
          [ {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"qr"}, {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"}, {k:["b/4"],d:"qr"} ],
          [ {k:["c/5"],d:"q"}, {k:["f/4"],d:"q"}, {k:["b/4"],d:"hr"} ],
          [ {k:["b/4"],d:"qr"}, {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"qr"}, {k:["f/4"],d:"q"} ],
          // Fill: Snare and Kick alternating 8th notes (straight)
          [ {k:["c/5"],d:"8"}, {k:["f/4"],d:"8"}, {k:["c/5"],d:"8"}, {k:["f/4"],d:"8"}, {k:["c/5"],d:"8"}, {k:["f/4"],d:"8"}, {k:["c/5"],d:"8"}, {k:["f/4"],d:"8"} ]
        ],
        beams: [
          [], [], [], [],
          [{start:0, end:1}, {start:3, end:4}], // Bar 5
          [], // Bar 6
          [{start:1, end:2}], // Bar 7
          [{start:0, end:1}, {start:2, end:3}, {start:4, end:5}, {start:6, end:7}] // Bar 8
        ],
        play: (bar, beat, time, upbeat, snare, kick) => {
          const eighth = Tone.Time("8n").toSeconds();
          if (bar === 1) { if(beat===0) snare.triggerAttackRelease("16n", time); if(beat===2) kick.triggerAttackRelease("C1", "8n", time); }
          if (bar === 2) { if(beat===1) snare.triggerAttackRelease("16n", time); if(beat===3) kick.triggerAttackRelease("C1", "8n", time); }
          if (bar === 3) { if(beat===2) snare.triggerAttackRelease("16n", time); }
          if (bar === 4) { if(beat===0) kick.triggerAttackRelease("C1", "8n", time); if(beat===2) snare.triggerAttackRelease("16n", time); }
          if (bar === 5) { if(beat===0) snare.triggerAttackRelease("16n", time+upbeat); if(beat===2) kick.triggerAttackRelease("C1", "8n", time+upbeat); }
          if (bar === 6) { if(beat===0) snare.triggerAttackRelease("16n", time); if(beat===1) kick.triggerAttackRelease("C1", "8n", time); }
          if (bar === 7) { if(beat===1) snare.triggerAttackRelease("16n", time+upbeat); if(beat===3) kick.triggerAttackRelease("C1", "8n", time); }
          if (bar === 8) {
            snare.triggerAttackRelease("16n", time);
            kick.triggerAttackRelease("C1", "8n", time+eighth);
          }
        }
      }
    ];

    // --- State Variables ---
    let isPlaying = false;
    let currentBpm = 120;
    let currentPatternIndex = 0;
    let isRandomMode = false;
    
    // --- UI Elements ---
    const playBtn = document.getElementById('play-btn');
    const bpmSlider = document.getElementById('bpm-slider');
    const bpmDisplay = document.getElementById('bpm-display');
    const barTracker = document.getElementById('bar-tracker');
    const statusText = document.getElementById('status-text');
    const beatDisplay = document.getElementById('beat-display');
    const modeSelect = document.getElementById('mode-select');
    const patternSelect = document.getElementById('pattern-select');

    // トラッカー生成
    const bars = [];
    for(let i = 1; i <= 8; i++) {
      const div = document.createElement('div');
      div.className = 'h-12 flex items-center justify-center rounded-lg border-2 border-gray-200 text-gray-400 font-bold text-lg bg-gray-50 transition-all duration-75';
      div.textContent = i;
      barTracker.appendChild(div);
      bars.push(div);
    }

    // イベントリスナー
    modeSelect.addEventListener('change', (e) => {
      isRandomMode = e.target.value === 'random';
      patternSelect.disabled = isRandomMode;
      if(!isPlaying) drawScore(); // 再生中でなければ即座に書き換え
    });
    
    patternSelect.addEventListener('change', (e) => {
      currentPatternIndex = parseInt(e.target.value, 10);
      if(!isPlaying) drawScore();
    });

    bpmSlider.addEventListener('input', (e) => {
      currentBpm = Number(e.target.value);
      bpmDisplay.textContent = currentBpm;
      if (Tone.Transport.state === "started") Tone.Transport.bpm.value = currentBpm;
    });

    // --- Audio Setup ---
    let clickHigh, clickLow, kick, snare;
    function initAudio() {
      if(clickHigh) return;
      clickHigh = new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.01 }, volume: -5 }).toDestination();
      clickLow = new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.01 }, volume: -10 }).toDestination();
      kick = new Tone.MembraneSynth({ volume: 2 }).toDestination();
      snare = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.2, sustain: 0 }, volume: 0 }).toDestination();
    }

    // --- Playback Logic ---
    async function togglePlayback() {
      if (isPlaying) {
        Tone.Transport.stop();
        Tone.Transport.cancel();
        isPlaying = false;
        playBtn.textContent = "START CLICK";
        playBtn.className = "w-full md:w-48 py-4 rounded-xl font-bold text-lg text-white bg-blue-600 hover:bg-blue-700 transition-all shadow-md";
        bars.forEach(b => { b.classList.remove('active-bar', 'fill-bar'); b.classList.add('border-gray-200', 'text-gray-400', 'bg-gray-50'); });
        statusText.textContent = "Ready";
        beatDisplay.textContent = "1-1";
      } else {
        await Tone.start();
        initAudio();
        Tone.Transport.bpm.value = currentBpm;

        let barCount = 1;
        let beatCount = 0;

        // ランダムモードなら開始時にランダム選択
        if(isRandomMode) {
          currentPatternIndex = Math.floor(Math.random() * patterns.length);
          Tone.Draw.schedule(() => drawScore(), Tone.now());
        }

        Tone.Transport.scheduleRepeat((time) => {
          const quarter = Tone.Time("4n").toSeconds();
          const upbeat = quarter * 0.67; // スイングフィール

          // メトロノーム
          if (beatCount === 0) clickHigh.triggerAttackRelease("A5", "32n", time, 0.5);
          else clickLow.triggerAttackRelease("A4", "32n", time, 0.5);

          // フレーズの再生
          patterns[currentPatternIndex].play(barCount, beatCount, time, upbeat, snare, kick);

          // UI Update
          Tone.Draw.schedule(() => {
            beatDisplay.textContent = `${barCount}-${beatCount + 1}`;

            if (beatCount === 0) {
              bars.forEach(b => { b.classList.remove('active-bar', 'fill-bar'); b.classList.add('border-gray-200', 'text-gray-400', 'bg-gray-50'); });
              const activeDiv = bars[barCount - 1];
              activeDiv.classList.remove('border-gray-200', 'text-gray-400', 'bg-gray-50');
              
              if (barCount === 8) {
                activeDiv.classList.add('fill-bar');
                statusText.textContent = "Bar 8: Fill-in";
                statusText.className = "text-xs font-bold text-red-500 uppercase tracking-wider";
              } else {
                activeDiv.classList.add('active-bar');
                statusText.textContent = `Bar ${barCount}: Comping`;
                statusText.className = "text-xs font-bold text-blue-600 uppercase tracking-wider";
              }
            }
          }, time);

          beatCount++;
          if (beatCount > 3) {
            beatCount = 0;
            barCount++;
            if (barCount > 8) {
              barCount = 1; // ループ
              // ランダムモードの場合はパターン変更
              if(isRandomMode) {
                currentPatternIndex = Math.floor(Math.random() * patterns.length);
                Tone.Draw.schedule(() => drawScore(), time + quarter); // 次の小節の頭で描画
              }
            }
          }
        }, "4n");

        Tone.Transport.start();
        isPlaying = true;
        playBtn.textContent = "STOP";
        playBtn.className = "w-full md:w-48 py-4 rounded-xl font-bold text-lg text-red-600 bg-red-100 hover:bg-red-200 transition-all shadow-md";
      }
    }
    playBtn.addEventListener('click', togglePlayback);

    // --- VexFlow Drawing ---
    function drawScore() {
      const VF = Vex.Flow;
      const container = document.getElementById("score-container");
      container.innerHTML = ""; 

      const renderer = new VF.Renderer(container, VF.Renderer.Backends.SVG);
      renderer.resize(850, 300);
      const context = renderer.getContext();

      const pattern = patterns[currentPatternIndex];
      const staves = [];
      const vfNotes = [];

      // Create Staves (4 bars top, 4 bars bottom)
      for(let i=0; i<8; i++) {
        let x = i < 4 ? 10 + (i * 205) : 10 + ((i-4) * 205);
        let y = i < 4 ? 20 : 150;
        let width = i === 0 || i === 4 ? 235 : 205; // Adjust for clef
        
        const stave = new VF.Stave(x, y, width).addClef("percussion");
        if(i === 0 || i === 4) stave.addTimeSignature("4/4");
        staves.push(stave);

        // Create Notes for this bar
        const barData = pattern.scoreNotes[i];
        const notes = barData.map(nd => new VF.StaveNote({ clef: "percussion", keys: nd.k, duration: nd.d }));
        vfNotes.push(notes);
      }

      // Draw Staves and Notes
      for(let i=0; i<8; i++) {
        staves[i].setContext(context).draw();
        VF.Formatter.FormatAndDraw(context, staves[i], vfNotes[i]);

        // Draw Beams
        const barBeams = pattern.beams[i];
        if (barBeams && barBeams.length > 0) {
          barBeams.forEach(b => {
             const beamNotes = vfNotes[i].slice(b.start, b.end + 1);
             new VF.Beam(beamNotes).setContext(context).draw();
          });
        }
      }
    }

    // Initial draw
    drawScore();
  </script>
</body>
</html>
