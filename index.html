<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jazz style Drumming Etude</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vexflow/3.0.9/vexflow-min.js"></script>
  <style>
    body { background-color: #fdfcf8; color: #1a1a1a; font-family: 'Inter', serif; }
    .book-page {
      background-color: #ffffff;
      border: 1px solid #e5e5e5;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
    }
    #score-container svg { max-width: 100%; height: auto; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4">

  <div class="max-w-4xl w-full space-y-6">
    
    <!-- ヘッダー -->
    <div class="text-center border-b-2 border-gray-200 pb-6 mb-8">
      <h1 class="text-4xl font-bold tracking-tight text-gray-900" style="font-family: 'Times New Roman', Times, serif;">Jazz style Drumming Etude</h1>
    </div>

    <!-- コントロールパネル -->
    <div class="book-page p-6 rounded-xl flex flex-col gap-6">
      
      <div class="flex flex-col md:flex-row items-center gap-6 w-full">
        <div class="flex-1 w-full space-y-2">
          <div class="flex justify-between items-end">
            <span class="font-bold text-gray-700 text-sm uppercase tracking-wider">Metronome (BPM)</span>
            <span id="bpm-display" class="font-bold text-3xl text-blue-600">120</span>
          </div>
          <input type="range" id="bpm-slider" min="60" max="250" step="1" value="120" class="w-full accent-blue-600 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" />
        </div>

        <button id="play-btn" class="w-full md:w-48 py-4 rounded-xl font-bold text-lg text-white bg-blue-600 hover:bg-blue-700 transition-all shadow-md">
          Start
        </button>
      </div>

      <!-- 設定エリア -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 border-t pt-4 border-gray-100 items-end">
        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Practice Mode</label>
          <select id="mode-select" class="w-full p-2.5 border border-gray-300 rounded-lg bg-white text-gray-800 font-medium focus:outline-none focus:border-blue-500">
            <option value="fixed">Fixed Pattern</option>
            <option value="random" selected>Random Pattern</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Fill-in Length</label>
          <select id="fill-len-select" class="w-full p-2.5 border border-gray-300 rounded-lg bg-white text-gray-800 font-medium focus:outline-none focus:border-blue-500">
            <option value="2beats">2 Beats (Bar 8, Beats 3-4)</option>
            <option value="1bar" selected>1 Bar (Bar 8)</option>
            <option value="1bar2beats">1 Bar + 2 Beats (Bar 7 Beat 3 ~ Bar 8)</option>
            <option value="2bars">2 Bars (Bars 7 &amp; 8)</option>
          </select>
        </div>

        <div>
          <button id="regenerate-btn" class="w-full py-2.5 px-4 border-2 border-blue-500 rounded-lg bg-blue-50 text-blue-700 font-bold hover:bg-blue-100 transition-colors shadow-sm">
            Regenerate
          </button>
        </div>
      </div>

    </div>

    <!-- トラッカー -->
    <div class="book-page p-5 rounded-xl space-y-3">
      <div class="flex justify-between items-center px-1">
        <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Phrase Tracker</span>
        <div class="flex items-center gap-4">
          <div id="beat-display" class="bg-[#3a3a3a] text-white font-mono font-bold text-lg px-3 py-1 rounded-md shadow-md tracking-widest">1-1</div>
          <span id="status-text" class="text-xs font-bold text-blue-600 uppercase">Ready</span>
        </div>
      </div>
    </div>

    <!-- 楽譜表示エリア -->
    <div class="book-page p-6 rounded-xl flex flex-col items-center overflow-x-auto">
      <div id="score-container" class="w-full flex justify-center min-w-[800px]"></div>
      <p class="text-sm text-gray-500 mt-6 text-center">※ライドとハイハットは4/4ジャズパターンをキープし、記譜されたスネア(上段)とキック(下段)を演奏、必要に応じてオーケストレーションしてください。</p>
    </div>

  </div>

  <script>
    // =========================================================================
    // ジョン・ライリー コンピング・ボキャブラリー
    // 『The Art of Bop Drumming』(pp. 18-29) 完全網羅
    // =========================================================================
    const compingVocab = [
      // --- Comp Example 1: 8分音符シンコペーション (pp. 18-19) ---
      // 4拍目裏
      { notes: [{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"}], events: [{t:3.67,inst:"snare"}] },
      // 2拍目裏
      { notes: [{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"}], events: [{t:1.67,inst:"snare"}] },
      // 1拍目裏 + 3拍目裏
      { notes: [{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"}], events: [{t:0.67,inst:"snare"},{t:2.67,inst:"snare"}] },
      // 2拍目裏 + 4拍目裏
      { notes: [{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"}], events: [{t:1.67,inst:"snare"},{t:3.67,inst:"snare"}] },
      // 2拍目 + 4拍目 (ダウンビート)
      { notes: [{k:["b/4"],d:"qr"},{k:["c/5"],d:"q"},{k:["b/4"],d:"qr"},{k:["c/5"],d:"q"}], events: [{t:1.0,inst:"snare"},{t:3.0,inst:"snare"}] },
      // 1拍目 + 3拍目裏
      { notes: [{k:["c/5"],d:"q"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"}], events: [{t:0.0,inst:"snare"},{t:2.67,inst:"snare"}] },
      // 1拍目 + 2拍目裏 + 3拍目 + 4拍目裏
      { notes: [{k:["c/5"],d:"q"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["c/5"],d:"q"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"}], events: [{t:0.0,inst:"snare"},{t:1.67,inst:"snare"},{t:2.0,inst:"snare"},{t:3.67,inst:"snare"}] },
      // 3拍目裏 + 4拍目
      { notes: [{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["c/5"],d:"q"}], events: [{t:2.67,inst:"snare"},{t:3.0,inst:"snare"}] },
      // 2拍目裏 + 3拍目裏 (連続アップビート)
      { notes: [{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"}], events: [{t:1.67,inst:"snare"},{t:2.67,inst:"snare"}] },

      // --- Comp Example 2: 3連符コンピング (pp. 22-23) ---
      // 1拍目3連符 (休-休-音) + 3拍目3連符 (休-休-音)
      { 
        notes: [
          {k:["b/4"],d:"8r"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},
          {k:["b/4"],d:"qr"},
          {k:["b/4"],d:"8r"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},
          {k:["b/4"],d:"qr"}
        ],
        tuplets: [[0, 3], [4, 7]],
        events: [{t:0.67,inst:"snare"},{t:2.67,inst:"snare"}] 
      },
      // 2拍目3連符 (音-休-音) + 4拍目3連符 (音-休-音)
      { 
        notes: [
          {k:["b/4"],d:"qr"},
          {k:["c/5"],d:"8"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},
          {k:["b/4"],d:"qr"},
          {k:["c/5"],d:"8"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"}
        ],
        tuplets: [[1, 4], [5, 8]],
        events: [{t:1.0,inst:"snare"},{t:1.67,inst:"snare"},{t:3.0,inst:"snare"},{t:3.67,inst:"snare"}] 
      },
      // 3拍目全体に3連符 (音-音-音)
      { 
        notes: [
          {k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"},
          {k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},
          {k:["b/4"],d:"qr"}
        ],
        tuplets: [[2, 5]],
        events: [{t:2.0,inst:"snare"},{t:2.33,inst:"snare"},{t:2.67,inst:"snare"}] 
      },
      // 1拍目3連符 (音-音-音) + 3拍目裏
      { 
        notes: [
          {k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},
          {k:["b/4"],d:"qr"},
          {k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},
          {k:["b/4"],d:"qr"}
        ],
        tuplets: [[0, 3]],
        events: [{t:0.0,inst:"snare"},{t:0.33,inst:"snare"},{t:0.67,inst:"snare"},{t:2.67,inst:"snare"}] 
      },
      // 2拍目3連符 (音-音-音) + 4拍目3連符 (音-音-音)
      {
        notes: [
          {k:["b/4"],d:"qr"},
          {k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},
          {k:["b/4"],d:"qr"},
          {k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["c/5"],d:"8"}
        ],
        tuplets: [[1, 4], [5, 8]],
        events: [
          {t:1.0,inst:"snare"},{t:1.33,inst:"snare"},{t:1.67,inst:"snare"},
          {t:3.0,inst:"snare"},{t:3.33,inst:"snare"},{t:3.67,inst:"snare"}
        ]
      },

      // --- Comp Example 3: バスドラム & Two-Voice (pp. 24-27) ---
      // キック4拍目裏 (Bomb)
      { notes: [{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"}], events: [{t:3.67,inst:"kick"}] },
      // キック1拍目 + 3拍目
      { notes: [{k:["f/4"],d:"q"},{k:["b/4"],d:"qr"},{k:["f/4"],d:"q"},{k:["b/4"],d:"qr"}], events: [{t:0.0,inst:"kick"},{t:2.0,inst:"kick"}] },
      // スネア1拍目裏 + キック3拍目裏
      { notes: [{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"},{k:["b/4"],d:"qr"}], events: [{t:0.67,inst:"snare"},{t:2.67,inst:"kick"}] },
      // スネア2拍目裏 + キック4拍目裏
      { notes: [{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"}], events: [{t:1.67,inst:"snare"},{t:3.67,inst:"kick"}] },
      // キック1拍目 + スネア2拍目裏 + キック4拍目
      { notes: [{k:["f/4"],d:"q"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"},{k:["f/4"],d:"q"}], events: [{t:0.0,inst:"kick"},{t:1.67,inst:"snare"},{t:3.0,inst:"kick"}] },
      // スネア(表)〜キック(裏) コール＆レスポンス
      { notes: [{k:["c/5"],d:"8"},{k:["f/4"],d:"8"},{k:["b/4"],d:"qr"},{k:["c/5"],d:"8"},{k:["f/4"],d:"8"},{k:["b/4"],d:"qr"}], events: [{t:0.0,inst:"snare"},{t:0.67,inst:"kick"},{t:2.0,inst:"snare"},{t:2.67,inst:"kick"}] },
      // スネア(裏)〜キック(表) 交互打ち
      { notes: [{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["f/4"],d:"q"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["f/4"],d:"q"}], events: [{t:0.67,inst:"snare"},{t:1.0,inst:"kick"},{t:2.67,inst:"snare"},{t:3.0,inst:"kick"}] },
      // キック2拍目裏 + スネア3拍目 + キック4拍目裏
      { notes: [{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"},{k:["c/5"],d:"q"},{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"}], events: [{t:1.67,inst:"kick"},{t:2.0,inst:"snare"},{t:3.67,inst:"kick"}] },

      // --- Comp Example 4: Two-Voice 3連符コンピング (pp. 28-29) ---
      // スネア-キック-スネアの3連符 (1拍目) + キック4拍目裏
      { 
        notes: [
          {k:["c/5"],d:"8"},{k:["f/4"],d:"8"},{k:["c/5"],d:"8"},
          {k:["b/4"],d:"qr"},
          {k:["b/4"],d:"qr"},
          {k:["b/4"],d:"8r"},{k:["f/4"],d:"8"}
        ],
        tuplets: [[0, 3]],
        events: [{t:0.0,inst:"snare"},{t:0.33,inst:"kick"},{t:0.67,inst:"snare"},{t:3.67,inst:"kick"}] 
      },
      // 2拍目3連符 (キック-スネア-キック) + スネア4拍目
      { 
        notes: [
          {k:["b/4"],d:"qr"},
          {k:["f/4"],d:"8"},{k:["c/5"],d:"8"},{k:["f/4"],d:"8"},
          {k:["b/4"],d:"qr"},
          {k:["c/5"],d:"q"}
        ],
        tuplets: [[1, 4]],
        events: [{t:1.0,inst:"kick"},{t:1.33,inst:"snare"},{t:1.67,inst:"kick"},{t:3.0,inst:"snare"}] 
      },
      // 3拍目・4拍目に連続3連符 (手足ポリリズム)
      { 
        notes: [
          {k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"},
          {k:["c/5"],d:"8"},{k:["f/4"],d:"8"},{k:["c/5"],d:"8"},
          {k:["f/4"],d:"8"},{k:["c/5"],d:"8"},{k:["f/4"],d:"8"}
        ],
        tuplets: [[2, 5], [5, 8]],
        events: [{t:2.0,inst:"snare"},{t:2.33,inst:"kick"},{t:2.67,inst:"snare"},{t:3.0,inst:"kick"},{t:3.33,inst:"snare"},{t:3.67,inst:"kick"}] 
      },
      // 1拍目3連符 (スネア-スネア-キック) + 3拍目3連符 (スネア-スネア-キック)
      {
        notes: [
          {k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["f/4"],d:"8"},
          {k:["b/4"],d:"qr"},
          {k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["f/4"],d:"8"},
          {k:["b/4"],d:"qr"}
        ],
        tuplets: [[0, 3], [4, 7]],
        events: [
          {t:0.0,inst:"snare"},{t:0.33,inst:"snare"},{t:0.67,inst:"kick"},
          {t:2.0,inst:"snare"},{t:2.33,inst:"snare"},{t:2.67,inst:"kick"}
        ]
      }
    ];

    // =========================================================================
    // フィルイン・ボキャブラリー (pp. 36-43)
    // =========================================================================

    // --- 2拍フィル (Bar 8の後半2拍: beats 3-4) ---
    const fills2Beats = [
      // 8分音符2打 + キック4分
      {
        notes: [{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["f/4"],d:"q"}],
        events: [{t:0.0,inst:"snare"},{t:0.67,inst:"snare"},{t:1.0,inst:"kick"}]
      },
      // 3連符フィル (スネア3連符 + キック4分)
      {
        notes: [
          {k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},
          {k:["f/4"],d:"q"}
        ],
        tuplets: [[0, 3]],
        events: [{t:0.0,inst:"snare"},{t:0.33,inst:"snare"},{t:0.67,inst:"snare"},{t:1.0,inst:"kick"}]
      },
      // 2拍連続3連符 (スネア→キックの下降: p. 40)
      {
        notes: [
          {k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},
          {k:["c/5"],d:"8"},{k:["f/4"],d:"8"},{k:["f/4"],d:"8"}
        ],
        tuplets: [[0, 3], [3, 6]],
        events: [
          {t:0.0,inst:"snare"},{t:0.33,inst:"snare"},{t:0.67,inst:"snare"},
          {t:1.0,inst:"snare"},{t:1.33,inst:"kick"},{t:1.67,inst:"kick"}
        ]
      },
      // 16分音符リニア (スネア2打 + キック2打 + スネア4分: p. 43)
      {
        notes: [{k:["c/5"],d:"16"},{k:["c/5"],d:"16"},{k:["f/4"],d:"16"},{k:["f/4"],d:"16"},{k:["c/5"],d:"q"}],
        events: [{t:0.0,inst:"snare"},{t:0.25,inst:"snare"},{t:0.5,inst:"kick"},{t:0.75,inst:"kick"},{t:1.0,inst:"snare"}]
      },
      // 3連符手足コンビネーション (スネア-キック-スネア + キック2打)
      {
        notes: [
          {k:["c/5"],d:"8"},{k:["f/4"],d:"8"},{k:["c/5"],d:"8"},
          {k:["f/4"],d:"8"},{k:["f/4"],d:"8"}
        ],
        tuplets: [[0, 3]],
        events: [{t:0.0,inst:"snare"},{t:0.33,inst:"kick"},{t:0.67,inst:"snare"},{t:1.0,inst:"kick"},{t:1.67,inst:"kick"}]
      }
    ];

    // --- 1小節フィル (Bar 8 丸ごと) ---
    const fills1Bar = [
      // 1. Classic Dropping Bombs (p. 24)
      {
        notes: [{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["f/4"],d:"q"},{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["f/4"],d:"q"}],
        events: [
          {t:0.0,inst:"snare"},{t:0.67,inst:"snare"},{t:1.0,inst:"kick"},
          {t:2.0,inst:"snare"},{t:2.67,inst:"snare"},{t:3.0,inst:"kick"}
        ]
      },
      // 2. Triplets in Groups of 4 (4つ割り3連符: p. 43, Beyond Bop p. 47)
      {
        notes: [
          {k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},
          {k:["f/4"],d:"8"},{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},
          {k:["c/5"],d:"8"},{k:["f/4"],d:"8"},{k:["c/5"],d:"8"},
          {k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["f/4"],d:"8"}
        ],
        tuplets: [[0, 3], [3, 6], [6, 9], [9, 12]],
        events: [
          {t:0.0,inst:"snare"},{t:0.33,inst:"snare"},{t:0.67,inst:"snare"},
          {t:1.0,inst:"kick"},{t:1.33,inst:"snare"},{t:1.67,inst:"snare"},
          {t:2.0,inst:"snare"},{t:2.33,inst:"kick"},{t:2.67,inst:"snare"},
          {t:3.0,inst:"snare"},{t:3.33,inst:"snare"},{t:3.67,inst:"kick"}
        ]
      },
      // 3. 3-Beat Phrases (3拍フレーズの3連符展開: pp. 40-41)
      {
        notes: [
          {k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},
          {k:["f/4"],d:"q"},
          {k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},
          {k:["f/4"],d:"q"}
        ],
        tuplets: [[0, 3], [4, 7]],
        events: [
          {t:0.0,inst:"snare"},{t:0.33,inst:"snare"},{t:0.67,inst:"snare"},
          {t:1.0,inst:"kick"},
          {t:2.0,inst:"snare"},{t:2.33,inst:"snare"},{t:2.67,inst:"snare"},
          {t:3.0,inst:"kick"}
        ]
      },
      // 4. 16分音符 4-Way Phrase (p. 43)
      {
        notes: [
          {k:["c/5"],d:"16"},{k:["c/5"],d:"16"},{k:["f/4"],d:"16"},{k:["f/4"],d:"16"},
          {k:["c/5"],d:"16"},{k:["c/5"],d:"16"},{k:["f/4"],d:"16"},{k:["f/4"],d:"16"},
          {k:["c/5"],d:"q"},{k:["f/4"],d:"q"}
        ],
        events: [
          {t:0.0,inst:"snare"},{t:0.25,inst:"snare"},{t:0.5,inst:"kick"},{t:0.75,inst:"kick"},
          {t:1.0,inst:"snare"},{t:1.25,inst:"snare"},{t:1.5,inst:"kick"},{t:1.75,inst:"kick"},
          {t:2.0,inst:"snare"},{t:3.0,inst:"kick"}
        ]
      },
      // 5. Max Roach スタイル: 3連符から8分音符への移行 (pp. 38-39)
      {
        notes: [
          {k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},
          {k:["f/4"],d:"q"},
          {k:["c/5"],d:"8"},{k:["f/4"],d:"8"},
          {k:["c/5"],d:"8"},{k:["f/4"],d:"8"}
        ],
        tuplets: [[0, 3]],
        events: [
          {t:0.0,inst:"snare"},{t:0.33,inst:"snare"},{t:0.67,inst:"snare"},
          {t:1.0,inst:"kick"},
          {t:2.0,inst:"snare"},{t:2.67,inst:"kick"},
          {t:3.0,inst:"snare"},{t:3.67,inst:"kick"}
        ]
      },
      // 6. 全拍3連符ロール＆アクセント (pp. 36-37)
      {
        notes: [
          {k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},
          {k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},
          {k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},
          {k:["f/4"],d:"q"}
        ],
        tuplets: [[0, 3], [3, 6], [6, 9]],
        events: [
          {t:0.0,inst:"snare"},{t:0.33,inst:"snare"},{t:0.67,inst:"snare"},
          {t:1.0,inst:"snare"},{t:1.33,inst:"snare"},{t:1.67,inst:"snare"},
          {t:2.0,inst:"snare"},{t:2.33,inst:"snare"},{t:2.67,inst:"snare"},
          {t:3.0,inst:"kick"}
        ]
      },
      // 7. 手足交互3連符カスケード (pp. 41-42)
      {
        notes: [
          {k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["f/4"],d:"8"},
          {k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["f/4"],d:"8"},
          {k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["f/4"],d:"8"},
          {k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["f/4"],d:"8"}
        ],
        tuplets: [[0, 3], [3, 6], [6, 9], [9, 12]],
        events: [
          {t:0.0,inst:"snare"},{t:0.33,inst:"snare"},{t:0.67,inst:"kick"},
          {t:1.0,inst:"snare"},{t:1.33,inst:"snare"},{t:1.67,inst:"kick"},
          {t:2.0,inst:"snare"},{t:2.33,inst:"snare"},{t:2.67,inst:"kick"},
          {t:3.0,inst:"snare"},{t:3.33,inst:"snare"},{t:3.67,inst:"kick"}
        ]
      }
    ];

    // =========================================================================
    // 状態管理
    // =========================================================================
    let isPlaying = false;
    let currentBpm = 120;
    let practiceMode = "random";
    let fillLengthMode = "1bar";

    let currentEtude = {
      bars: [] // 各小節: { notes: [...], tuplets: [[start, end]], events: [...] }
    };

    // UI Elements
    const playBtn = document.getElementById('play-btn');
    const bpmSlider = document.getElementById('bpm-slider');
    const bpmDisplay = document.getElementById('bpm-display');
    const statusText = document.getElementById('status-text');
    const beatDisplay = document.getElementById('beat-display');
    const modeSelect = document.getElementById('mode-select');
    const fillLenSelect = document.getElementById('fill-len-select');
    const regenerateBtn = document.getElementById('regenerate-btn');

    // --- エチュード生成ロジック ---
    function generateNewEtude() {
      currentEtude.bars = [];
      const fixedComp = compingVocab[Math.floor(Math.random() * compingVocab.length)];

      function getComp() {
        return practiceMode === "fixed" ? fixedComp : compingVocab[Math.floor(Math.random() * compingVocab.length)];
      }

      if (fillLengthMode === "2beats") {
        for (let i = 0; i < 7; i++) currentEtude.bars.push({ ...getComp() });
        const fill2 = fills2Beats[Math.floor(Math.random() * fills2Beats.length)];
        // 8小節目: 拍1-2コンピング(2拍分) + 拍3-4フィル
        const halfCompNotes = [{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"}];
        const halfCompEvents = [{t:1.67, inst:"snare"}];
        
        // フィル音符のタプレット位置オフセット
        const offset = halfCompNotes.length;
        const fillTuplets = (fill2.tuplets || []).map(t => [t[0] + offset, t[1] + offset]);
        const fillEvents = (fill2.events || []).map(e => ({ ...e, t: e.t + 2.0 }));

        currentEtude.bars.push({
          notes: [...halfCompNotes, ...fill2.notes],
          tuplets: fillTuplets,
          events: [...halfCompEvents, ...fillEvents]
        });

      } else if (fillLengthMode === "1bar") {
        for (let i = 0; i < 7; i++) currentEtude.bars.push({ ...getComp() });
        const fill1 = fills1Bar[Math.floor(Math.random() * fills1Bar.length)];
        currentEtude.bars.push({
          notes: fill1.notes,
          tuplets: fill1.tuplets || [],
          events: fill1.events || []
        });

      } else if (fillLengthMode === "1bar2beats") {
        for (let i = 0; i < 6; i++) currentEtude.bars.push({ ...getComp() });
        const fill2 = fills2Beats[Math.floor(Math.random() * fills2Beats.length)];
        const fill1 = fills1Bar[Math.floor(Math.random() * fills1Bar.length)];

        // Bar 7: 拍1-2コンピング + 拍3-4フィル開始
        const halfCompNotes = [{k:["c/5"],d:"q"},{k:["b/4"],d:"qr"}];
        const halfCompEvents = [{t:0.0, inst:"snare"}];
        const offset = halfCompNotes.length;
        const fillTuplets = (fill2.tuplets || []).map(t => [t[0] + offset, t[1] + offset]);
        const fillEvents = (fill2.events || []).map(e => ({ ...e, t: e.t + 2.0 }));

        currentEtude.bars.push({
          notes: [...halfCompNotes, ...fill2.notes],
          tuplets: fillTuplets,
          events: [...halfCompEvents, ...fillEvents]
        });

        // Bar 8: フィル後半
        currentEtude.bars.push({
          notes: fill1.notes,
          tuplets: fill1.tuplets || [],
          events: fill1.events || []
        });

      } else if (fillLengthMode === "2bars") {
        for (let i = 0; i < 6; i++) currentEtude.bars.push({ ...getComp() });
        const fillA = fills1Bar[Math.floor(Math.random() * fills1Bar.length)];
        const fillB = fills1Bar[Math.floor(Math.random() * fills1Bar.length)];
        currentEtude.bars.push({
          notes: fillA.notes,
          tuplets: fillA.tuplets || [],
          events: fillA.events || []
        });
        currentEtude.bars.push({
          notes: fillB.notes,
          tuplets: fillB.tuplets || [],
          events: fillB.events || []
        });
      }
    }

    // --- Audio Engine Setup ---
    let clickHigh, clickLow, kick, snare;
    function initAudio() {
      if (clickHigh) return;
      clickHigh = new Tone.MembraneSynth({
        pitchDecay: 0.008,
        octaves: 2,
        oscillator: { type: "sine" },
        envelope: { attack: 0.001, decay: 0.05, sustain: 0 },
        volume: -2
      }).toDestination();

      clickLow = new Tone.MembraneSynth({
        pitchDecay: 0.008,
        octaves: 2,
        oscillator: { type: "sine" },
        envelope: { attack: 0.001, decay: 0.04, sustain: 0 },
        volume: -5
      }).toDestination();

      kick = new Tone.MembraneSynth({
        pitchDecay: 0.05,
        octaves: 4,
        oscillator: { type: "sine" },
        envelope: { attack: 0.001, decay: 0.3, sustain: 0.01, release: 0.2 },
        volume: 3
      }).toDestination();

      snare = new Tone.NoiseSynth({
        noise: { type: "white" },
        envelope: { attack: 0.001, decay: 0.18, sustain: 0 },
        volume: 1
      }).toDestination();
    }

    // --- Playback Logic ---
    async function togglePlayback() {
      if (isPlaying) {
        Tone.Transport.stop();
        Tone.Transport.cancel();
        isPlaying = false;
        playBtn.textContent = "Start";
        playBtn.className = "w-full md:w-48 py-4 rounded-xl font-bold text-lg text-white bg-blue-600 hover:bg-blue-700 transition-all shadow-md";
        statusText.textContent = "Ready";
        statusText.className = "text-xs font-bold text-blue-600 uppercase";
        beatDisplay.textContent = "1-1";
      } else {
        await Tone.start();
        initAudio();
        Tone.Transport.bpm.value = currentBpm;

        let barCount = 1;
        let beatCount = 0;

        Tone.Transport.scheduleRepeat((time) => {
          const quarter = Tone.Time("4n").toSeconds();

          // メトロノームクリック
          if (beatCount === 0) clickHigh.triggerAttackRelease("G5", "32n", time, 1.0);
          else clickLow.triggerAttackRelease("C5", "32n", time, 0.8);

          // 小節の頭でその小節全体のイベントを一括スケジュール
          if (beatCount === 0) {
            const barData = currentEtude.bars[barCount - 1];
            if (barData && barData.events) {
              barData.events.forEach(ev => {
                const evTime = time + ev.t * quarter;
                if (ev.inst === "snare") snare.triggerAttackRelease("16n", evTime);
                if (ev.inst === "kick") kick.triggerAttackRelease("C1", "8n", evTime);
              });
            }
          }

          Tone.Draw.schedule(() => {
            beatDisplay.textContent = `${barCount}-${beatCount + 1}`;
            const isFillBar = (fillLengthMode === "2bars" && barCount >= 7) ||
                              (fillLengthMode === "1bar2beats" && (barCount === 8 || (barCount === 7 && beatCount >= 2))) ||
                              (fillLengthMode === "1bar" && barCount === 8) ||
                              (fillLengthMode === "2beats" && barCount === 8 && beatCount >= 2);

            if (isFillBar) {
              statusText.textContent = `Bar ${barCount}: Fill-in`;
              statusText.className = "text-xs font-bold text-red-500 uppercase tracking-wider";
            } else {
              statusText.textContent = `Bar ${barCount}: Comping`;
              statusText.className = "text-xs font-bold text-blue-600 uppercase tracking-wider";
            }
          }, time);

          beatCount++;
          if (beatCount > 3) {
            beatCount = 0;
            barCount++;
            if (barCount > 8) {
              barCount = 1;
              if (practiceMode === "random") {
                generateNewEtude();
                Tone.Draw.schedule(() => drawScore(), time + quarter);
              }
            }
          }
        }, "4n");

        Tone.Transport.start();
        isPlaying = true;
        playBtn.textContent = "Stop";
        playBtn.className = "w-full md:w-48 py-4 rounded-xl font-bold text-lg text-red-600 bg-red-100 hover:bg-red-200 transition-all shadow-md";
      }
    }

    // --- VexFlow 楽譜描画 (Tuplet対応) ---
    function drawScore() {
      const VF = Vex.Flow;
      const container = document.getElementById("score-container");
      container.innerHTML = ""; 

      const renderer = new VF.Renderer(container, VF.Renderer.Backends.SVG);
      renderer.resize(950, 260);
      const context = renderer.getContext();

      const staves = [];
      const vfNotes = [];
      const beamsToDraw = [];
      const tupletsToDraw = [];

      let currentX = 10;
      let currentY = 10;

      for (let i = 0; i < 8; i++) {
        if (i === 4) {
          currentX = 10;
          currentY = 130;
        }

        const isStartOfLine = (i === 0 || i === 4);
        const width = isStartOfLine ? 230 : 220;

        const stave = new VF.Stave(currentX, currentY, width);

        if (isStartOfLine) {
          stave.addClef("percussion");
          stave.setBegBarType(VF.Barline.type.SINGLE);
        } else {
          stave.setBegBarType(VF.Barline.type.NONE);
        }

        if (i === 3 || i === 7) {
          stave.setEndBarType(VF.Barline.type.END);
        }

        staves.push(stave);
        currentX += width;

        // 音符データ生成
        const barItem = currentEtude.bars[i];
        const notes = barItem.notes.map(nd => new VF.StaveNote({ clef: "percussion", keys: nd.k, duration: nd.d }));
        vfNotes.push(notes);

        // 3連符 (Tuplet) 生成
        if (barItem.tuplets && barItem.tuplets.length > 0) {
          barItem.tuplets.forEach(([start, end]) => {
            const tupletNotes = notes.slice(start, end);
            if (tupletNotes.length > 0) {
              const tuplet = new VF.Tuplet(tupletNotes, {
                num_notes: 3,
                notes_occupied: 2,
                ratioed: false
              });
              tupletsToDraw.push(tuplet);
            }
          });
        }

        // 自動ビーム生成 (休符は巻き込まず連桁)
        const autoBeams = VF.Beam.generateBeams(notes, {
          beam_rests: false,
          maintain_stem_directions: true
        });
        beamsToDraw.push(...autoBeams);
      }

      // レンダリング
      for (let i = 0; i < 8; i++) {
        staves[i].setContext(context).draw();
        VF.Formatter.FormatAndDraw(context, staves[i], vfNotes[i]);
      }
      beamsToDraw.forEach(beam => beam.setContext(context).draw());
      tupletsToDraw.forEach(tuplet => tuplet.setContext(context).draw());
    }

    // --- イベントリスナー ---
    modeSelect.addEventListener('change', (e) => {
      practiceMode = e.target.value;
      generateNewEtude();
      drawScore();
    });

    fillLenSelect.addEventListener('change', (e) => {
      fillLengthMode = e.target.value;
      generateNewEtude();
      drawScore();
    });

    regenerateBtn.addEventListener('click', () => {
      generateNewEtude();
      drawScore();
    });

    bpmSlider.addEventListener('input', (e) => {
      currentBpm = Number(e.target.value);
      bpmDisplay.textContent = currentBpm;
      if (Tone.Transport.state === "started") Tone.Transport.bpm.value = currentBpm;
    });

    playBtn.addEventListener('click', togglePlayback);

    // 初期生成 & 描画
    generateNewEtude();
    drawScore();
  </script>
</body>
</html>
