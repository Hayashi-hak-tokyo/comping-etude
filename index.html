<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beyond Bop Practice</title>
  <!-- Tailwind CSS (スタイリング用) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tone.js (オーディオエンジン) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    /* カスタムアニメーションとUIの微調整 */
    body {
      background-color: #0a0a0a;
      -webkit-tap-highlight-color: transparent;
    }
    .active-beat {
      box-shadow: 0 0 12px currentColor;
    }
  </style>
</head>
<body class="min-h-screen text-gray-100 font-sans flex items-center justify-center p-4">

  <div class="max-w-xl w-full space-y-8">
    
    <!-- ヘッダー -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center p-3 bg-blue-500/10 rounded-full mb-4">
        <!-- SVG Icon (Activity) -->
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-400">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
        </svg>
      </div>
      <h1 class="text-3xl font-bold tracking-tight">Beyond Bop Practice</h1>
      <p class="text-gray-400 text-sm">7-Bar Comping & 1-Bar Bebop Fill</p>
    </div>

    <!-- メインディスプレイ -->
    <div class="bg-[#111111] border border-gray-800 rounded-2xl p-8 shadow-2xl relative overflow-hidden">
      
      <!-- ステータスバッジ -->
      <div class="absolute top-6 left-6">
        <span id="status-badge" class="px-3 py-1 text-xs font-bold uppercase tracking-wider rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/30 transition-colors duration-300">
          Comping
        </span>
      </div>

      <!-- 小節カウンター -->
      <div class="flex flex-col items-center justify-center mt-12 mb-8">
        <div class="flex items-baseline gap-2">
          <span id="current-bar" class="text-8xl font-black tabular-nums transition-colors duration-200 text-gray-100">
            1
          </span>
          <span class="text-3xl font-bold text-gray-600">/ 8</span>
        </div>
        
        <!-- 拍(Beat)インジケーター -->
        <div class="flex gap-3 mt-6" id="beat-indicators">
          <div id="beat-0" class="w-3 h-3 rounded-full bg-gray-800 transition-all duration-100"></div>
          <div id="beat-1" class="w-3 h-3 rounded-full bg-gray-800 transition-all duration-100"></div>
          <div id="beat-2" class="w-3 h-3 rounded-full bg-gray-800 transition-all duration-100"></div>
          <div id="beat-3" class="w-3 h-3 rounded-full bg-gray-800 transition-all duration-100"></div>
        </div>
      </div>

      <!-- 8小節グリッドビジュアライザー -->
      <div class="grid grid-cols-8 gap-2 mt-8" id="bar-visualizers">
        <div id="bar-1" class="h-2 rounded-full bg-gray-800 transition-all duration-300"></div>
        <div id="bar-2" class="h-2 rounded-full bg-gray-800 transition-all duration-300"></div>
        <div id="bar-3" class="h-2 rounded-full bg-gray-800 transition-all duration-300"></div>
        <div id="bar-4" class="h-2 rounded-full bg-gray-800 transition-all duration-300"></div>
        <div id="bar-5" class="h-2 rounded-full bg-gray-800 transition-all duration-300"></div>
        <div id="bar-6" class="h-2 rounded-full bg-gray-800 transition-all duration-300"></div>
        <div id="bar-7" class="h-2 rounded-full bg-gray-800 transition-all duration-300"></div>
        <div id="bar-8" class="h-2 rounded-full bg-gray-800 transition-all duration-300"></div>
      </div>
    </div>

    <!-- コントロール -->
    <div class="bg-[#111111] border border-gray-800 rounded-2xl p-6 space-y-6">
      <div class="space-y-4">
        <div class="flex justify-between items-end">
          <label class="text-sm font-semibold text-gray-400">Tempo</label>
          <div class="text-2xl font-bold tabular-nums">
            <span id="bpm-display">160</span> <span class="text-sm text-gray-500 font-normal">BPM</span>
          </div>
        </div>
        <input
          type="range"
          id="bpm-slider"
          min="80"
          max="280"
          step="1"
          value="160"
          class="w-full h-2 bg-gray-800 rounded-full appearance-none cursor-pointer accent-blue-500"
        />
      </div>

      <button
        id="play-btn"
        class="w-full py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 transition-all duration-200 bg-blue-500 text-white hover:bg-blue-600 hover:shadow-lg hover:shadow-blue-500/25 active:scale-[0.98]"
      >
        <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        <svg id="stop-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 hidden"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
        <span id="play-text">Start Practice</span>
      </button>
    </div>

  </div>

  <script>
    // --- UI Elements ---
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const stopIcon = document.getElementById('stop-icon');
    const playText = document.getElementById('play-text');
    const bpmSlider = document.getElementById('bpm-slider');
    const bpmDisplay = document.getElementById('bpm-display');
    const currentBarEl = document.getElementById('current-bar');
    const statusBadge = document.getElementById('status-badge');
    const beats = [
      document.getElementById('beat-0'),
      document.getElementById('beat-1'),
      document.getElementById('beat-2'),
      document.getElementById('beat-3')
    ];
    const bars = [];
    for(let i=1; i<=8; i++) bars.push(document.getElementById(`bar-${i}`));

    // --- State ---
    let isPlaying = false;
    let currentBpm = 160;
    let transportId = null;
    let synths = {};

    // --- Tone.js Setup ---
    function initSynths() {
      if(Object.keys(synths).length > 0) return; // 既に初期化済みならスキップ

      synths = {
        kick: new Tone.MembraneSynth().toDestination(),
        snare: new Tone.NoiseSynth({
          noise: { type: "white" },
          envelope: { attack: 0.001, decay: 0.2, sustain: 0 },
          volume: -5,
        }).toDestination(),
        ride: new Tone.MetalSynth({
          frequency: 250,
          envelope: { attack: 0.001, decay: 1.4, release: 0.2 },
          harmonicity: 5.1,
          modulationIndex: 32,
          resonance: 4000,
          octaves: 1.5,
          volume: -8,
        }).toDestination(),
        hihat: new Tone.MetalSynth({
          frequency: 400,
          envelope: { attack: 0.001, decay: 0.1, release: 0.01 },
          harmonicity: 5.1,
          modulationIndex: 32,
          resonance: 4000,
          octaves: 1.5,
          volume: -10,
        }).toDestination()
      };
    }

    // --- UI Update Logic ---
    function updateUI(bar, beat) {
      // Bar Text
      currentBarEl.textContent = bar;
      
      // Colors based on section
      const isFill = (bar === 8);
      const mainColor = isFill ? 'text-orange-400' : 'text-gray-100';
      currentBarEl.className = `text-8xl font-black tabular-nums transition-colors duration-200 ${mainColor}`;

      // Status Badge
      statusBadge.textContent = isFill ? 'Fill-in (Dropping Bombs)' : 'Comping';
      statusBadge.className = `px-3 py-1 text-xs font-bold uppercase tracking-wider rounded-full transition-colors duration-300 ${
        isFill ? 'bg-orange-500/20 text-orange-400 border-orange-500/30' : 'bg-blue-500/20 text-blue-400 border-blue-500/30'
      }`;

      // Beat Indicators
      beats.forEach((b, index) => {
        if (index === beat) {
          const colorClass = isFill ? 'bg-orange-400 text-orange-400 active-beat' : 'bg-blue-400 text-blue-400 active-beat';
          b.className = `w-3 h-3 rounded-full transition-all duration-100 ${colorClass}`;
        } else {
          b.className = 'w-3 h-3 rounded-full bg-gray-800 transition-all duration-100';
        }
      });

      // Bar Visualizers
      bars.forEach((b, index) => {
        const barNum = index + 1;
        if (bar === barNum) {
          b.className = `h-2 rounded-full transition-all duration-300 ${barNum === 8 ? 'bg-orange-400' : 'bg-blue-400'}`;
        } else {
          b.className = 'h-2 rounded-full bg-gray-800 transition-all duration-300';
        }
      });
    }

    function resetUI() {
      currentBarEl.textContent = "1";
      currentBarEl.className = "text-8xl font-black tabular-nums transition-colors duration-200 text-gray-100";
      statusBadge.textContent = 'Comping';
      statusBadge.className = "px-3 py-1 text-xs font-bold uppercase tracking-wider rounded-full bg-blue-500/20 text-blue-400 border-blue-500/30 transition-colors duration-300";
      beats.forEach(b => b.className = 'w-3 h-3 rounded-full bg-gray-800 transition-all duration-100');
      bars.forEach(b => b.className = 'h-2 rounded-full bg-gray-800 transition-all duration-300');
    }

    // --- Playback Logic ---
    async function togglePlayback() {
      if (isPlaying) {
        // Stop
        Tone.Transport.stop();
        if (transportId !== null) Tone.Transport.clear(transportId);
        isPlaying = false;
        
        // Update Button UI
        playBtn.className = "w-full py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 transition-all duration-200 bg-blue-500 text-white hover:bg-blue-600 hover:shadow-lg hover:shadow-blue-500/25 active:scale-[0.98]";
        playIcon.classList.remove('hidden');
        stopIcon.classList.add('hidden');
        playText.textContent = "Start Practice";
        resetUI();

      } else {
        // Start
        await Tone.start();
        initSynths();
        
        Tone.Transport.bpm.value = currentBpm;
        Tone.Transport.swing = 0.6; // ジャズのスイングフィール
        Tone.Transport.swingSubdivision = "8n";

        let barCount = 1;
        let beatCount = 0; // 0 to 3

        transportId = Tone.Transport.scheduleRepeat((time) => {
          const { kick, snare, ride, hihat } = synths;
          
          // UI Update synchronously with audio
          Tone.Draw.schedule(() => {
            updateUI(barCount, beatCount);
          }, time);

          // --- 音楽的ロジック ---
          if (barCount <= 7) {
            // 【Bars 1-7】 Comping
            ride.triggerAttackRelease("4n", time, 0.7); // 1, 2, 3, 4拍目
            
            // ライドのスキップノート (2拍裏、4拍裏)
            if (beatCount === 1 || beatCount === 3) {
              ride.triggerAttackRelease("8n", time + Tone.Time("8n").toSeconds(), 0.4);
              hihat.triggerAttackRelease("8n", time, 0.8); // ハイハット (2, 4拍目)
            }

            // フェザリング (4分音符で軽く踏むバスドラム)
            kick.triggerAttackRelease("C1", "8n", time, 0.1);

            // コンピングのバリエーション
            if (barCount % 2 === 0 && beatCount === 2) {
              snare.triggerAttackRelease("8n", time + Tone.Time("8n").toSeconds(), 0.6); // 3拍裏
            }
            if (barCount % 4 === 0 && beatCount === 3) {
              kick.triggerAttackRelease("C1", "8n", time, 0.7); // 4拍目アクセント
            }

          } else {
            // 【Bar 8】 Bebop Fill (Dropping Bombs)
            if (beatCount === 0) {
              snare.triggerAttackRelease("16n", time, 0.9);
              ride.triggerAttackRelease("4n", time, 0.8);
            }
            if (beatCount === 1) {
              kick.triggerAttackRelease("C1", "8n", time, 1); // Bomb!
              hihat.triggerAttackRelease("8n", time, 0.7);
            }
            if (beatCount === 2) {
              snare.triggerAttackRelease("16n", time, 0.7);
              snare.triggerAttackRelease("16n", time + Tone.Time("8n").toSeconds(), 0.8);
            }
            if (beatCount === 3) {
              kick.triggerAttackRelease("C1", "8n", time, 0.9); // Bomb!
              ride.triggerAttackRelease("4n", time, 0.8);
            }
          }

          // カウンターの更新
          beatCount++;
          if (beatCount > 3) {
            beatCount = 0;
            barCount++;
            if (barCount > 8) barCount = 1;
          }
        }, "4n");

        Tone.Transport.start();
        isPlaying = true;

        // Update Button UI
        playBtn.className = "w-full py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 transition-all duration-200 bg-red-500/10 text-red-500 border border-red-500/50 hover:bg-red-500/20 active:scale-[0.98]";
        playIcon.classList.add('hidden');
        stopIcon.classList.remove('hidden');
        playText.textContent = "Stop";
      }
    }

    // --- Events ---
    playBtn.addEventListener('click', togglePlayback);
    
    bpmSlider.addEventListener('input', (e) => {
      currentBpm = Number(e.target.value);
      bpmDisplay.textContent = currentBpm;
      if (Tone.Transport.state === "started") {
        Tone.Transport.bpm.rampTo(currentBpm, 0.1);
      }
    });

  </script>
</body>
</html>
