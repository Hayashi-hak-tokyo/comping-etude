<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bop Drumming Etude - John Riley Concept</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vexflow/3.0.9/vexflow-min.js"></script>
  <style>
    body { background-color: #fdfcf8; color: #1a1a1a; font-family: 'Inter', serif; }
    .book-page {
      background-color: #ffffff;
      border: 1px solid #e5e5e5;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
    }
    #score-container svg { max-width: 100%; height: auto; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4">

  <div class="max-w-4xl w-full space-y-6">
    
    <!-- ヘッダー -->
    <div class="text-center border-b-2 border-gray-200 pb-6 mb-8">
      <h1 class="text-4xl font-bold tracking-tight text-gray-900" style="font-family: 'Times New Roman', Times, serif;">Bop Drumming Etude</h1>
      <p class="text-gray-500 mt-2 font-medium">John Riley: The Art of Bop Drumming &amp; Beyond Bop</p>
    </div>

    <!-- コントロールパネル -->
    <div class="book-page p-6 rounded-xl flex flex-col gap-6">
      
      <div class="flex flex-col md:flex-row items-center gap-6 w-full">
        <div class="flex-1 w-full space-y-2">
          <div class="flex justify-between items-end">
            <span class="font-bold text-gray-700 text-sm uppercase tracking-wider">Metronome (BPM)</span>
            <span id="bpm-display" class="font-bold text-3xl text-blue-600">120</span>
          </div>
          <input type="range" id="bpm-slider" min="60" max="250" step="1" value="120" class="w-full accent-blue-600 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" />
        </div>

        <button id="play-btn" class="w-full md:w-48 py-4 rounded-xl font-bold text-lg text-white bg-blue-600 hover:bg-blue-700 transition-all shadow-md">
          START CLICK
        </button>
      </div>

      <!-- モード選択と再生成 -->
      <div class="flex flex-col sm:flex-row gap-4 border-t pt-4 border-gray-100 items-center justify-between">
        <div class="w-full sm:w-1/2">
          <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Practice Mode</label>
          <select id="mode-select" class="w-full p-2.5 border border-gray-300 rounded-lg bg-white text-gray-800 font-medium focus:outline-none focus:border-blue-500">
            <option value="fixed">Fixed Pattern (Same Comping for 7 Bars + Fill)</option>
            <option value="random">Random Pattern (Randomized Comping for 7 Bars + Fill)</option>
          </select>
        </div>
        <div class="w-full sm:w-1/3">
          <label class="block text-xs font-bold text-transparent uppercase tracking-wider mb-2 hidden sm:block">Action</label>
          <button id="regenerate-btn" class="w-full py-2.5 px-4 border-2 border-blue-500 rounded-lg bg-blue-50 text-blue-700 font-bold hover:bg-blue-100 transition-colors shadow-sm">
            REGENERATE 🎲
          </button>
        </div>
      </div>

    </div>

    <!-- トラッカー -->
    <div class="book-page p-5 rounded-xl space-y-3">
      <div class="flex justify-between items-center px-1">
        <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Phrase Tracker</span>
        <div class="flex items-center gap-4">
          <div id="beat-display" class="bg-[#3a3a3a] text-white font-mono font-bold text-lg px-3 py-1 rounded-md shadow-md tracking-widest">1-1</div>
          <span id="status-text" class="text-xs font-bold text-blue-600 uppercase">Ready</span>
        </div>
      </div>
    </div>

    <!-- 楽譜表示エリア -->
    <div class="book-page p-6 rounded-xl flex flex-col items-center overflow-x-auto">
      <div id="score-container" class="w-full flex justify-center min-w-[800px]"></div>
      <p class="text-sm text-gray-500 mt-6 text-center">※ライドとハイハットは4/4ジャズパターンをキープし、記譜されたスネア(上段)とキック(下段)を演奏してください。</p>
    </div>

  </div>

  <script>
    // =========================================================================
    // ジョン・ライリーのコンピング・ボキャブラリー集 (The Art of Bop Drumming & Beyond Bop)
    // =========================================================================
    const compingVocab = [
      // 1. Snare Beat 4 Offbeat (基本の4拍裏)
      {
        notes: [ {k:["b/4"],d:"qr"}, {k:["b/4"],d:"qr"}, {k:["b/4"],d:"qr"}, {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"} ],
        events: [{beat:3, sub:1, inst:"snare"}]
      },
      // 2. Snare Beat 2 Offbeat (2拍裏)
      {
        notes: [ {k:["b/4"],d:"qr"}, {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"qr"}, {k:["b/4"],d:"qr"} ],
        events: [{beat:1, sub:1, inst:"snare"}]
      },
      // 3. Snare Beat 1 Offbeat & Beat 3 Offbeat
      {
        notes: [ {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"qr"}, {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"qr"} ],
        events: [{beat:0, sub:1, inst:"snare"}, {beat:2, sub:1, inst:"snare"}]
      },
      // 4. Snare Beat 2 & 4 Backbeat Comping
      {
        notes: [ {k:["b/4"],d:"qr"}, {k:["c/5"],d:"q"}, {k:["b/4"],d:"qr"}, {k:["c/5"],d:"q"} ],
        events: [{beat:1, sub:0, inst:"snare"}, {beat:3, sub:0, inst:"snare"}]
      },
      // 5. Kick Beat 4 Offbeat
      {
        notes: [ {k:["b/4"],d:"qr"}, {k:["b/4"],d:"qr"}, {k:["b/4"],d:"qr"}, {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"} ],
        events: [{beat:3, sub:1, inst:"kick"}]
      },
      // 6. Kick Beat 1 & 3 Downbeats
      {
        notes: [ {k:["f/4"],d:"q"}, {k:["b/4"],d:"qr"}, {k:["f/4"],d:"q"}, {k:["b/4"],d:"qr"} ],
        events: [{beat:0, sub:0, inst:"kick"}, {beat:2, sub:0, inst:"kick"}]
      },
      // 7. Kick Beat 2 Offbeat & Beat 4 Downbeat
      {
        notes: [ {k:["b/4"],d:"qr"}, {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"}, {k:["b/4"],d:"qr"}, {k:["f/4"],d:"q"} ],
        events: [{beat:1, sub:1, inst:"kick"}, {beat:3, sub:0, inst:"kick"}]
      },
      // 8. Two-Voice: Snare Beat 1 Offbeat + Kick Beat 3 Offbeat
      {
        notes: [ {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"qr"}, {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"}, {k:["b/4"],d:"qr"} ],
        events: [{beat:0, sub:1, inst:"snare"}, {beat:2, sub:1, inst:"kick"}]
      },
      // 9. Two-Voice: Snare Beat 2 Offbeat + Kick Beat 4 Offbeat
      {
        notes: [ {k:["b/4"],d:"qr"}, {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"qr"}, {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"} ],
        events: [{beat:1, sub:1, inst:"snare"}, {beat:3, sub:1, inst:"kick"}]
      },
      // 10. Call & Response: Kick Beat 1 Down -> Snare Beat 2 Off -> Kick Beat 4
      {
        notes: [ {k:["f/4"],d:"q"}, {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"qr"}, {k:["f/4"],d:"q"} ],
        events: [{beat:0, sub:0, inst:"kick"}, {beat:1, sub:1, inst:"snare"}, {beat:3, sub:0, inst:"kick"}]
      },
      // 11. Two-Voice Continuous 8ths: Snare Down, Kick Up (Beat 1)
      {
        notes: [ {k:["c/5"],d:"8"}, {k:["f/4"],d:"8"}, {k:["b/4"],d:"qr"}, {k:["b/4"],d:"qr"}, {k:["b/4"],d:"qr"} ],
        events: [{beat:0, sub:0, inst:"snare"}, {beat:0, sub:1, inst:"kick"}]
      },
      // 12. Two-Voice Continuous 8ths: Snare Down, Kick Up (Beat 3)
      {
        notes: [ {k:["b/4"],d:"qr"}, {k:["b/4"],d:"qr"}, {k:["c/5"],d:"8"}, {k:["f/4"],d:"8"}, {k:["b/4"],d:"qr"} ],
        events: [{beat:2, sub:0, inst:"snare"}, {beat:2, sub:1, inst:"kick"}]
      },
      // 13. Double Offbeat: Snare Beat 3 Off + Kick Beat 4 Off (Push to next bar)
      {
        notes: [ {k:["b/4"],d:"qr"}, {k:["b/4"],d:"qr"}, {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"} ],
        events: [{beat:2, sub:1, inst:"snare"}, {beat:3, sub:1, inst:"kick"}]
      },
      // 14. Elvin 3-Beat Motive: Snare Up -> Kick Down -> Kick Up
      {
        notes: [ {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["f/4"],d:"q"}, {k:["b/4"],d:"qr"}, {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"} ],
        events: [{beat:0, sub:1, inst:"snare"}, {beat:1, sub:0, inst:"kick"}, {beat:3, sub:1, inst:"kick"}]
      },
      // 15. Broken-Time (Jack DeJohnette style: sparse placement)
      {
        notes: [ {k:["b/4"],d:"qr"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"8r"}, {k:["b/4"],d:"qr"}, {k:["f/4"],d:"q"} ],
        events: [{beat:1, sub:0, inst:"snare"}, {beat:3, sub:0, inst:"kick"}]
      },
      // 16. Snare 3-Beat phrase
      {
        notes: [ {k:["c/5"],d:"q"}, {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"}, {k:["b/4"],d:"qr"} ],
        events: [{beat:0, sub:0, inst:"snare"}, {beat:1, sub:1, inst:"snare"}, {beat:2, sub:1, inst:"kick"}]
      },
      // 17. Feathering with Snare 2 & 4 Upbeats
      {
        notes: [ {k:["f/4"],d:"q"}, {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["f/4"],d:"q"}, {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"} ],
        events: [{beat:0, sub:0, inst:"kick"}, {beat:1, sub:1, inst:"snare"}, {beat:2, sub:0, inst:"kick"}, {beat:3, sub:1, inst:"snare"}]
      },
      // 18. Kick Bomb on Beat 2 Down & Snare on Beat 4 Off
      {
        notes: [ {k:["b/4"],d:"qr"}, {k:["f/4"],d:"q"}, {k:["b/4"],d:"qr"}, {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"} ],
        events: [{beat:1, sub:0, inst:"kick"}, {beat:3, sub:1, inst:"snare"}]
      },
      // 19. Two-Voice Cross Dialogue: Kick Up -> Snare Up
      {
        notes: [ {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"}, {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"qr"}, {k:["b/4"],d:"qr"} ],
        events: [{beat:0, sub:1, inst:"kick"}, {beat:1, sub:1, inst:"snare"}]
      },
      // 20. Two-Voice Cross Dialogue: Snare Up -> Kick Up
      {
        notes: [ {k:["b/4"],d:"qr"}, {k:["b/4"],d:"qr"}, {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"} ],
        events: [{beat:2, sub:1, inst:"snare"}, {beat:3, sub:1, inst:"kick"}]
      },
      // 21. Subtle Comping: Only Beat 3 Offbeat Snare
      {
        notes: [ {k:["b/4"],d:"qr"}, {k:["b/4"],d:"qr"}, {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"qr"} ],
        events: [{beat:2, sub:1, inst:"snare"}]
      },
      // 22. Subtle Comping: Only Beat 2 Kick Down
      {
        notes: [ {k:["b/4"],d:"qr"}, {k:["f/4"],d:"q"}, {k:["b/4"],d:"qr"}, {k:["b/4"],d:"qr"} ],
        events: [{beat:1, sub:0, inst:"kick"}]
      },
      // 23. Snare Drop: Beat 1 Down + Beat 2 Off + Beat 4 Down
      {
        notes: [ {k:["c/5"],d:"q"}, {k:["b/4"],d:"8r"}, {k:["c/5"],d:"8"}, {k:["b/4"],d:"qr"}, {k:["c/5"],d:"q"} ],
        events: [{beat:0, sub:0, inst:"snare"}, {beat:1, sub:1, inst:"snare"}, {beat:3, sub:0, inst:"snare"}]
      },
      // 24. Kick Drop: Beat 1 Off + Beat 2 Off + Beat 3 Down
      {
        notes: [ {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"}, {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"}, {k:["f/4"],d:"q"}, {k:["b/4"],d:"qr"} ],
        events: [{beat:0, sub:1, inst:"kick"}, {beat:1, sub:1, inst:"kick"}, {beat:2, sub:0, inst:"kick"}]
      }
    ];

    // =========================================================================
    // ジョン・ライリーのビバップ・フィルイン集 (Bar 8 用)
    // =========================================================================
    const fillVocab = [
      // Fill 1: Classic Dropping Bombs (Snare 8ths + Kick Bombs)
      {
        notes: [
          {k:["c/5"],d:"8"}, {k:["c/5"],d:"8"}, {k:["f/4"],d:"q"},
          {k:["c/5"],d:"8"}, {k:["c/5"],d:"8"}, {k:["f/4"],d:"q"}
        ],
        play: (time, upbeat, snare, kick) => {
          const q = Tone.Time("4n").toSeconds();
          snare.triggerAttackRelease("16n", time);
          snare.triggerAttackRelease("16n", time + upbeat);
          kick.triggerAttackRelease("C1", "8n", time + q);
          snare.triggerAttackRelease("16n", time + q * 2);
          snare.triggerAttackRelease("16n", time + q * 2 + upbeat);
          kick.triggerAttackRelease("C1", "8n", time + q * 3);
        }
      },
      // Fill 2: Triplets in Groups of 4 (16th note 4-Grouping)
      {
        notes: [
          {k:["c/5"],d:"16"}, {k:["c/5"],d:"16"}, {k:["f/4"],d:"16"}, {k:["f/4"],d:"16"},
          {k:["c/5"],d:"16"}, {k:["c/5"],d:"16"}, {k:["f/4"],d:"16"}, {k:["f/4"],d:"16"},
          {k:["c/5"],d:"q"}, {k:["f/4"],d:"q"}
        ],
        play: (time, upbeat, snare, kick) => {
          const q = Tone.Time("4n").toSeconds();
          const sx = q / 4;
          [0, 1].forEach(b => {
            const bt = time + b * q;
            snare.triggerAttackRelease("16n", bt);
            snare.triggerAttackRelease("16n", bt + sx);
            kick.triggerAttackRelease("C1", "8n", bt + sx * 2);
            kick.triggerAttackRelease("C1", "8n", bt + sx * 3);
          });
          snare.triggerAttackRelease("16n", time + q * 2);
          kick.triggerAttackRelease("C1", "8n", time + q * 3);
        }
      },
      // Fill 3: 3-Beat Phrases (Beyond Bop p.47)
      {
        notes: [
          {k:["c/5"],d:"8"}, {k:["f/4"],d:"8"}, {k:["c/5"],d:"q"},
          {k:["f/4"],d:"8"}, {k:["c/5"],d:"8"}, {k:["f/4"],d:"q"}
        ],
        play: (time, upbeat, snare, kick) => {
          const q = Tone.Time("4n").toSeconds();
          snare.triggerAttackRelease("16n", time);
          kick.triggerAttackRelease("C1", "8n", time + upbeat);
          snare.triggerAttackRelease("16n", time + q);
          kick.triggerAttackRelease("C1", "8n", time + q * 2);
          snare.triggerAttackRelease("16n", time + q * 2 + upbeat);
          kick.triggerAttackRelease("C1", "8n", time + q * 3);
        }
      },
      // Fill 4: Variable Speed Phrase (16ths to 8ths)
      {
        notes: [
          {k:["c/5"],d:"16"}, {k:["c/5"],d:"16"}, {k:["f/4"],d:"16"}, {k:["f/4"],d:"16"},
          {k:["c/5"],d:"8"}, {k:["f/4"],d:"8"},
          {k:["c/5"],d:"8"}, {k:["f/4"],d:"8"},
          {k:["c/5"],d:"q"}
        ],
        play: (time, upbeat, snare, kick) => {
          const q = Tone.Time("4n").toSeconds();
          const sx = q / 4;
          snare.triggerAttackRelease("16n", time);
          snare.triggerAttackRelease("16n", time + sx);
          kick.triggerAttackRelease("C1", "8n", time + sx * 2);
          kick.triggerAttackRelease("C1", "8n", time + sx * 3);
          snare.triggerAttackRelease("16n", time + q);
          kick.triggerAttackRelease("C1", "8n", time + q + upbeat);
          snare.triggerAttackRelease("16n", time + q * 2);
          kick.triggerAttackRelease("C1", "8n", time + q * 2 + upbeat);
          snare.triggerAttackRelease("16n", time + q * 3);
        }
      },
      // Fill 5: Max Roach / Philly Joe Jones Cross Accent
      {
        notes: [
          {k:["c/5"],d:"8"}, {k:["c/5"],d:"8"}, {k:["c/5"],d:"8"}, {k:["f/4"],d:"8"},
          {k:["c/5"],d:"8"}, {k:["c/5"],d:"8"}, {k:["f/4"],d:"q"}
        ],
        play: (time, upbeat, snare, kick) => {
          const q = Tone.Time("4n").toSeconds();
          snare.triggerAttackRelease("16n", time);
          snare.triggerAttackRelease("16n", time + upbeat);
          snare.triggerAttackRelease("16n", time + q);
          kick.triggerAttackRelease("C1", "8n", time + q + upbeat);
          snare.triggerAttackRelease("16n", time + q * 2);
          snare.triggerAttackRelease("16n", time + q * 2 + upbeat);
          kick.triggerAttackRelease("C1", "8n", time + q * 3);
        }
      },
      // Fill 6: Descending Roll with Kick Accents
      {
        notes: [
          {k:["c/5"],d:"16"}, {k:["c/5"],d:"16"}, {k:["c/5"],d:"16"}, {k:["c/5"],d:"16"},
          {k:["f/4"],d:"q"},
          {k:["c/5"],d:"16"}, {k:["c/5"],d:"16"}, {k:["c/5"],d:"16"}, {k:["c/5"],d:"16"},
          {k:["f/4"],d:"q"}
        ],
        play: (time, upbeat, snare, kick) => {
          const q = Tone.Time("4n").toSeconds();
          const sx = q / 4;
          [0, 1, 2, 3].forEach(n => snare.triggerAttackRelease("16n", time + n * sx));
          kick.triggerAttackRelease("C1", "8n", time + q);
          [0, 1, 2, 3].forEach(n => snare.triggerAttackRelease("16n", time + q * 2 + n * sx));
          kick.triggerAttackRelease("C1", "8n", time + q * 3);
        }
      },
      // Fill 7: Syncopated Kick Bomb (Tony Williams Style)
      {
        notes: [
          {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"}, {k:["c/5"],d:"q"},
          {k:["b/4"],d:"8r"}, {k:["f/4"],d:"8"}, {k:["c/5"],d:"q"}
        ],
        play: (time, upbeat, snare, kick) => {
          const q = Tone.Time("4n").toSeconds();
          kick.triggerAttackRelease("C1", "8n", time + upbeat);
          snare.triggerAttackRelease("16n", time + q);
          kick.triggerAttackRelease("C1", "8n", time + q * 2 + upbeat);
          snare.triggerAttackRelease("16n", time + q * 3);
        }
      },
      // Fill 8: Linear 4-Way Phrase
      {
        notes: [
          {k:["c/5"],d:"8"}, {k:["f/4"],d:"8"}, {k:["c/5"],d:"8"}, {k:["f/4"],d:"8"},
          {k:["c/5"],d:"8"}, {k:["f/4"],d:"8"}, {k:["c/5"],d:"8"}, {k:["f/4"],d:"8"}
        ],
        play: (time, upbeat, snare, kick) => {
          const q = Tone.Time("4n").toSeconds();
          [0, 1, 2, 3].forEach(b => {
            snare.triggerAttackRelease("16n", time + b * q);
            kick.triggerAttackRelease("C1", "8n", time + b * q + upbeat);
          });
        }
      },
      // Fill 9: Triplet feel emulation (Group of 3 against pulse)
      {
        notes: [
          {k:["c/5"],d:"q"}, {k:["c/5"],d:"8"}, {k:["f/4"],d:"8"},
          {k:["c/5"],d:"q"}, {k:["f/4"],d:"q"}
        ],
        play: (time, upbeat, snare, kick) => {
          const q = Tone.Time("4n").toSeconds();
          snare.triggerAttackRelease("16n", time);
          snare.triggerAttackRelease("16n", time + q);
          kick.triggerAttackRelease("C1", "8n", time + q + upbeat);
          snare.triggerAttackRelease("16n", time + q * 2);
          kick.triggerAttackRelease("C1", "8n", time + q * 3);
        }
      },
      // Fill 10: Ending Bomb Setup
      {
        notes: [
          {k:["c/5"],d:"16"}, {k:["c/5"],d:"16"}, {k:["c/5"],d:"16"}, {k:["c/5"],d:"16"},
          {k:["c/5"],d:"8"}, {k:["f/4"],d:"8"},
          {k:["f/4"],d:"q"}, {k:["c/5"],d:"q"}
        ],
        play: (time, upbeat, snare, kick) => {
          const q = Tone.Time("4n").toSeconds();
          const sx = q / 4;
          [0, 1, 2, 3].forEach(n => snare.triggerAttackRelease("16n", time + n * sx));
          snare.triggerAttackRelease("16n", time + q);
          kick.triggerAttackRelease("C1", "8n", time + q + upbeat);
          kick.triggerAttackRelease("C1", "8n", time + q * 2);
          snare.triggerAttackRelease("16n", time + q * 3);
        }
      }
    ];

    // 現在生成されている8小節のエチュードデータ
    let currentEtude = {
      bars: [], // 0..6: compingVocab, 7: fillVocab
    };

    // --- State Variables ---
    let isPlaying = false;
    let currentBpm = 120;
    let practiceMode = "fixed"; // "fixed" or "random"

    // --- UI Elements ---
    const playBtn = document.getElementById('play-btn');
    const bpmSlider = document.getElementById('bpm-slider');
    const bpmDisplay = document.getElementById('bpm-display');
    const statusText = document.getElementById('status-text');
    const beatDisplay = document.getElementById('beat-display');
    const modeSelect = document.getElementById('mode-select');
    const regenerateBtn = document.getElementById('regenerate-btn');

    // --- エチュード生成ロジック ---
    function generateNewEtude() {
      currentEtude.bars = [];
      const fillChoice = fillVocab[Math.floor(Math.random() * fillVocab.length)];

      if (practiceMode === "fixed") {
        // Fixed: 1〜7小節は同一の1フレーズで固定
        const compChoice = compingVocab[Math.floor(Math.random() * compingVocab.length)];
        for (let i = 0; i < 7; i++) {
          currentEtude.bars.push(compChoice);
        }
      } else {
        // Random: 1〜7小節すべてランダムに配置
        for (let i = 0; i < 7; i++) {
          const compChoice = compingVocab[Math.floor(Math.random() * compingVocab.length)];
          currentEtude.bars.push(compChoice);
        }
      }
      currentEtude.bars.push(fillChoice);
    }

    modeSelect.addEventListener('change', (e) => {
      practiceMode = e.target.value;
      generateNewEtude();
      drawScore();
    });

    regenerateBtn.addEventListener('click', () => {
      generateNewEtude();
      drawScore();
    });

    bpmSlider.addEventListener('input', (e) => {
      currentBpm = Number(e.target.value);
      bpmDisplay.textContent = currentBpm;
      if (Tone.Transport.state === "started") Tone.Transport.bpm.value = currentBpm;
    });

    // --- Audio Setup ---
    let clickHigh, clickLow, kick, snare;
    function initAudio() {
      if (clickHigh) return;
      clickHigh = new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.01 }, volume: -4 }).toDestination();
      clickLow = new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.01 }, volume: -9 }).toDestination();
      kick = new Tone.MembraneSynth({ volume: 3 }).toDestination();
      snare = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.2, sustain: 0 }, volume: 1 }).toDestination();
    }

    // --- Playback Logic ---
    async function togglePlayback() {
      if (isPlaying) {
        Tone.Transport.stop();
        Tone.Transport.cancel();
        isPlaying = false;
        playBtn.textContent = "START CLICK";
        playBtn.className = "w-full md:w-48 py-4 rounded-xl font-bold text-lg text-white bg-blue-600 hover:bg-blue-700 transition-all shadow-md";
        statusText.textContent = "Ready";
        beatDisplay.textContent = "1-1";
      } else {
        await Tone.start();
        initAudio();
        Tone.Transport.bpm.value = currentBpm;

        let barCount = 1;
        let beatCount = 0;

        Tone.Transport.scheduleRepeat((time) => {
          const quarter = Tone.Time("4n").toSeconds();
          const upbeat = quarter * 0.67; // スイングフィール

          // メトロノーム (1拍目高音、2-4拍目低音)
          if (beatCount === 0) clickHigh.triggerAttackRelease("A5", "32n", time, 0.6);
          else clickLow.triggerAttackRelease("A4", "32n", time, 0.6);

          // ドラム音再生
          if (barCount <= 7) {
            const barData = currentEtude.bars[barCount - 1];
            if (barData && barData.events) {
              barData.events.forEach(ev => {
                if (ev.beat === beatCount) {
                  const evTime = ev.sub === 0 ? time : time + upbeat;
                  if (ev.inst === "snare") snare.triggerAttackRelease("16n", evTime);
                  if (ev.inst === "kick") kick.triggerAttackRelease("C1", "8n", evTime);
                }
              });
            }
          } else {
            // 8小節目: フィルイン
            if (beatCount === 0) {
              const fillData = currentEtude.bars[7];
              if (fillData && fillData.play) {
                fillData.play(time, upbeat, snare, kick);
              }
            }
          }

          // UI更新
          Tone.Draw.schedule(() => {
            beatDisplay.textContent = `${barCount}-${beatCount + 1}`;
            if (beatCount === 0) {
              if (barCount === 8) {
                statusText.textContent = "Bar 8: Fill-in";
                statusText.className = "text-xs font-bold text-red-500 uppercase tracking-wider";
              } else {
                statusText.textContent = `Bar ${barCount}: Comping`;
                statusText.className = "text-xs font-bold text-blue-600 uppercase tracking-wider";
              }
            }
          }, time);

          beatCount++;
          if (beatCount > 3) {
            beatCount = 0;
            barCount++;
            if (barCount > 8) {
              barCount = 1;
              if (practiceMode === "random") {
                generateNewEtude();
                Tone.Draw.schedule(() => drawScore(), time + quarter);
              }
            }
          }
        }, "4n");

        Tone.Transport.start();
        isPlaying = true;
        playBtn.textContent = "STOP";
        playBtn.className = "w-full md:w-48 py-4 rounded-xl font-bold text-lg text-red-600 bg-red-100 hover:bg-red-200 transition-all shadow-md";
      }
    }
    playBtn.addEventListener('click', togglePlayback);

    // --- VexFlow 楽譜描画 ---
    function drawScore() {
      const VF = Vex.Flow;
      const container = document.getElementById("score-container");
      container.innerHTML = ""; 

      const renderer = new VF.Renderer(container, VF.Renderer.Backends.SVG);
      renderer.resize(950, 260);
      const context = renderer.getContext();

      const staves = [];
      const vfNotes = [];
      const beamsToDraw = [];

      let currentX = 10;
      let currentY = 10;

      for (let i = 0; i < 8; i++) {
        if (i === 4) {
          currentX = 10;
          currentY = 130;
        }

        const isStartOfLine = (i === 0 || i === 4);
        const width = isStartOfLine ? 230 : 220;

        const stave = new VF.Stave(currentX, currentY, width);

        // 先頭のみ打楽器記号を付与、4/4表記は不要のため付与しない
        if (isStartOfLine) {
          stave.addClef("percussion");
          stave.setBegBarType(VF.Barline.type.SINGLE);
        } else {
          stave.setBegBarType(VF.Barline.type.NONE);
        }

        if (i === 3 || i === 7) {
          stave.setEndBarType(VF.Barline.type.END);
        }

        staves.push(stave);
        currentX += width;

        // 音符データ生成
        const barItem = currentEtude.bars[i];
        const notes = barItem.notes.map(nd => new VF.StaveNote({ clef: "percussion", keys: nd.k, duration: nd.d }));
        vfNotes.push(notes);

        // VexFlowの標準ビーム自動生成（フラグとビームの重複を完全防止）
        const autoBeams = VF.Beam.generateBeams(notes, {
          beam_rests: false,
          maintain_stem_directions: true
        });
        beamsToDraw.push(...autoBeams);
      }

      // レンダリング & ビーム描画
      for (let i = 0; i < 8; i++) {
        staves[i].setContext(context).draw();
        VF.Formatter.FormatAndDraw(context, staves[i], vfNotes[i]);
      }
      beamsToDraw.forEach(beam => beam.setContext(context).draw());
    }

    // 初期生成 & 描画
    generateNewEtude();
    drawScore();
  </script>
</body>
</html>
