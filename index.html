<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jazz style Drumming Etude</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vexflow/3.0.9/vexflow-min.js"></script>
  <style>
    body { background-color: #fdfcf8; color: #1a1a1a; font-family: 'Inter', serif; }
    .book-page {
      background-color: #ffffff;
      border: 1px solid #e5e5e5;
      box-shadow: 0 10px 30px rgba(0,0,0,0.03);
    }
    #score-container svg { max-width: 100%; height: auto; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4">

  <div class="max-w-4xl w-full space-y-6">
    
    <!-- ヘッダー -->
    <div class="text-center border-b-2 border-gray-200 pb-6 mb-8">
      <h1 class="text-4xl font-bold tracking-tight text-gray-900" style="font-family: 'Times New Roman', Times, serif;">Jazz style Drumming Etude</h1>
    </div>

    <!-- コントロールパネル -->
    <div class="book-page p-6 rounded-xl flex flex-col gap-6">
      
      <div class="flex flex-col md:flex-row items-center gap-6 w-full">
        <div class="flex-1 w-full space-y-2">
          <div class="flex justify-between items-end">
            <span class="font-bold text-gray-700 text-sm uppercase tracking-wider">Metronome (BPM)</span>
            <span id="bpm-display" class="font-bold text-3xl text-blue-600">120</span>
          </div>
          <input type="range" id="bpm-slider" min="60" max="250" step="1" value="120" class="w-full accent-blue-600 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" />
        </div>

        <button id="play-btn" class="w-full md:w-48 py-4 rounded-xl font-bold text-lg text-white bg-blue-600 hover:bg-blue-700 transition-all shadow-md">
          Start
        </button>
      </div>

      <!-- 設定エリア -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 border-t pt-4 border-gray-100 items-end">
        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Practice Mode</label>
          <select id="mode-select" class="w-full p-2.5 border border-gray-300 rounded-lg bg-white text-gray-800 font-medium focus:outline-none focus:border-blue-500">
            <option value="fixed">Fixed Pattern</option>
            <option value="random" selected>Random Pattern</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Fill-in Length</label>
          <select id="fill-len-select" class="w-full p-2.5 border border-gray-300 rounded-lg bg-white text-gray-800 font-medium focus:outline-none focus:border-blue-500">
            <option value="2beats">2 Beats (Bar 8, Beats 3-4)</option>
            <option value="1bar" selected>1 Bar (Bar 8)</option>
            <option value="1bar2beats">1 Bar + 2 Beats (Bar 7 Beat 3 ~ Bar 8)</option>
            <option value="2bars">2 Bars (Bars 7 &amp; 8)</option>
          </select>
        </div>

        <div>
          <button id="regenerate-btn" class="w-full py-2.5 px-4 border-2 border-blue-500 rounded-lg bg-blue-50 text-blue-700 font-bold hover:bg-blue-100 transition-colors shadow-sm">
            Regenerate
          </button>
        </div>
      </div>

    </div>

    <!-- トラッカー -->
    <div class="book-page p-5 rounded-xl space-y-3">
      <div class="flex justify-between items-center px-1">
        <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Phrase Tracker</span>
        <div class="flex items-center gap-4">
          <div id="beat-display" class="bg-[#3a3a3a] text-white font-mono font-bold text-lg px-3 py-1 rounded-md shadow-md tracking-widest">1-1</div>
          <span id="status-text" class="text-xs font-bold text-blue-600 uppercase">Ready</span>
        </div>
      </div>
    </div>

    <!-- 楽譜表示エリア -->
    <div class="book-page p-6 rounded-xl flex flex-col items-center overflow-x-auto">
      <div id="score-container" class="w-full flex justify-center min-w-[800px]"></div>
      <p class="text-sm text-gray-500 mt-6 text-center">※ライドとハイハットは4/4ジャズパターンをキープし、記譜されたスネア(上段)とキック(下段)を演奏してください。</p>
    </div>

  </div>

  <script>
    // =========================================================================
    // ジョン・ライリー コンピング・ボキャブラリー
    // 『The Art of Bop Drumming』(pp. 18-29) & 『Beyond Bop Drumming』
    // =========================================================================
    const compingVocab = [
      // --- Comp Example 1: Snare Interdependence (pp. 18-19) ---
      { notes: [{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"}], events: [{beat:3,sub:1,inst:"snare"}] },
      { notes: [{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"}], events: [{beat:1,sub:1,inst:"snare"}] },
      { notes: [{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"}], events: [{beat:0,sub:1,inst:"snare"},{beat:2,sub:1,inst:"snare"}] },
      { notes: [{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"}], events: [{beat:1,sub:1,inst:"snare"},{beat:3,sub:1,inst:"snare"}] },
      { notes: [{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"}], events: [{beat:0,sub:1,inst:"snare"},{beat:3,sub:1,inst:"snare"}] },
      { notes: [{k:["b/4"],d:"qr"},{k:["c/5"],d:"q"},{k:["b/4"],d:"qr"},{k:["c/5"],d:"q"}], events: [{beat:1,sub:0,inst:"snare"},{beat:3,sub:0,inst:"snare"}] },
      { notes: [{k:["c/5"],d:"q"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"}], events: [{beat:0,sub:0,inst:"snare"},{beat:2,sub:1,inst:"snare"}] },
      { notes: [{k:["b/4"],d:"qr"},{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"}], events: [{beat:1,sub:0,inst:"snare"},{beat:1,sub:1,inst:"snare"},{beat:3,sub:1,inst:"snare"}] },
      { notes: [{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"}], events: [{beat:0,sub:0,inst:"snare"},{beat:0,sub:1,inst:"snare"},{beat:2,sub:1,inst:"snare"}] },
      { notes: [{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"}], events: [{beat:0,sub:1,inst:"snare"},{beat:1,sub:0,inst:"snare"},{beat:1,sub:1,inst:"snare"}] },
      { notes: [{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"},{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"}], events: [{beat:2,sub:0,inst:"snare"},{beat:2,sub:1,inst:"snare"},{beat:3,sub:1,inst:"snare"}] },
      { notes: [{k:["c/5"],d:"q"},{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"}], events: [{beat:0,sub:0,inst:"snare"},{beat:1,sub:0,inst:"snare"},{beat:1,sub:1,inst:"snare"}] },

      // --- Comp Example 2 & Bass Drum Comping (pp. 22-25) ---
      { notes: [{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"}], events: [{beat:3,sub:1,inst:"kick"}] },
      { notes: [{k:["f/4"],d:"q"},{k:["b/4"],d:"qr"},{k:["f/4"],d:"q"},{k:["b/4"],d:"qr"}], events: [{beat:0,sub:0,inst:"kick"},{beat:2,sub:0,inst:"kick"}] },
      { notes: [{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"},{k:["b/4"],d:"qr"},{k:["f/4"],d:"q"}], events: [{beat:1,sub:1,inst:"kick"},{beat:3,sub:0,inst:"kick"}] },
      { notes: [{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"},{k:["b/4"],d:"qr"}], events: [{beat:0,sub:1,inst:"kick"},{beat:2,sub:1,inst:"kick"}] },
      { notes: [{k:["b/4"],d:"qr"},{k:["f/4"],d:"q"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"}], events: [{beat:1,sub:0,inst:"kick"}] },
      { notes: [{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"},{k:["b/4"],d:"qr"}], events: [{beat:2,sub:1,inst:"kick"}] },
      { notes: [{k:["f/4"],d:"8"},{k:["f/4"],d:"8"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"},{k:["b/4"],d:"qr"}], events: [{beat:0,sub:0,inst:"kick"},{beat:0,sub:1,inst:"kick"},{beat:2,sub:1,inst:"kick"}] },
      { notes: [{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"}], events: [{beat:0,sub:1,inst:"kick"},{beat:3,sub:1,inst:"kick"}] },

      // --- Comp Example 3: Two-Voice Dialogue (pp. 26-27) ---
      { notes: [{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"},{k:["b/4"],d:"qr"}], events: [{beat:0,sub:1,inst:"snare"},{beat:2,sub:1,inst:"kick"}] },
      { notes: [{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"}], events: [{beat:1,sub:1,inst:"snare"},{beat:3,sub:1,inst:"kick"}] },
      { notes: [{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"}], events: [{beat:0,sub:1,inst:"kick"},{beat:1,sub:1,inst:"snare"}] },
      { notes: [{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"}], events: [{beat:2,sub:1,inst:"snare"},{beat:3,sub:1,inst:"kick"}] },
      { notes: [{k:["f/4"],d:"q"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"},{k:["f/4"],d:"q"}], events: [{beat:0,sub:0,inst:"kick"},{beat:1,sub:1,inst:"snare"},{beat:3,sub:0,inst:"kick"}] },
      { notes: [{k:["c/5"],d:"8"},{k:["f/4"],d:"8"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"}], events: [{beat:0,sub:0,inst:"snare"},{beat:0,sub:1,inst:"kick"}] },
      { notes: [{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"},{k:["c/5"],d:"8"},{k:["f/4"],d:"8"},{k:["b/4"],d:"qr"}], events: [{beat:2,sub:0,inst:"snare"},{beat:2,sub:1,inst:"kick"}] },
      { notes: [{k:["b/4"],d:"qr"},{k:["c/5"],d:"8"},{k:["f/4"],d:"8"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"}], events: [{beat:1,sub:0,inst:"snare"},{beat:1,sub:1,inst:"kick"}] },
      { notes: [{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"},{k:["c/5"],d:"8"},{k:["f/4"],d:"8"}], events: [{beat:3,sub:0,inst:"snare"},{beat:3,sub:1,inst:"kick"}] },
      { notes: [{k:["c/5"],d:"q"},{k:["b/4"],d:"qr"},{k:["f/4"],d:"8"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"}], events: [{beat:0,sub:0,inst:"snare"},{beat:2,sub:0,inst:"kick"},{beat:2,sub:1,inst:"snare"}] },
      { notes: [{k:["b/4"],d:"qr"},{k:["c/5"],d:"8"},{k:["f/4"],d:"8"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"}], events: [{beat:1,sub:0,inst:"snare"},{beat:1,sub:1,inst:"kick"},{beat:2,sub:1,inst:"snare"}] },
      { notes: [{k:["f/4"],d:"8"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"},{k:["f/4"],d:"8"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"}], events: [{beat:0,sub:0,inst:"kick"},{beat:0,sub:1,inst:"snare"},{beat:2,sub:0,inst:"kick"},{beat:2,sub:1,inst:"snare"}] },

      // --- Comp Example 4 & Beyond Bop 3-Voice Conversions (pp. 28-29, Beyond Bop pp. 7-10) ---
      { notes: [{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"}], events: [{beat:0,sub:0,inst:"snare"},{beat:0,sub:1,inst:"snare"},{beat:1,sub:1,inst:"kick"}] },
      { notes: [{k:["b/4"],d:"qr"},{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"},{k:["b/4"],d:"qr"}], events: [{beat:1,sub:0,inst:"snare"},{beat:1,sub:1,inst:"snare"},{beat:2,sub:1,inst:"kick"}] },
      { notes: [{k:["f/4"],d:"8"},{k:["f/4"],d:"8"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"}], events: [{beat:0,sub:0,inst:"kick"},{beat:0,sub:1,inst:"kick"},{beat:1,sub:1,inst:"snare"}] },
      { notes: [{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["f/4"],d:"8"},{k:["f/4"],d:"8"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"qr"}], events: [{beat:0,sub:1,inst:"snare"},{beat:1,sub:0,inst:"kick"},{beat:1,sub:1,inst:"kick"}] },
      { notes: [{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["f/4"],d:"8"},{k:["f/4"],d:"8"},{k:["b/4"],d:"qr"}], events: [{beat:1,sub:1,inst:"snare"},{beat:2,sub:0,inst:"kick"},{beat:2,sub:1,inst:"kick"}] },
      { notes: [{k:["c/5"],d:"8"},{k:["b/4"],d:"8r"},{k:["f/4"],d:"q"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["f/4"],d:"q"}], events: [{beat:0,sub:0,inst:"snare"},{beat:1,sub:0,inst:"kick"},{beat:2,sub:1,inst:"snare"},{beat:3,sub:0,inst:"kick"}] },

      // --- Jack DeJohnette / Broken Time / Elvin Jones Motifs (Beyond Bop pp. 13-19) ---
      { notes: [{k:["b/4"],d:"qr"},{k:["c/5"],d:"8"},{k:["b/4"],d:"8r"},{k:["b/4"],d:"qr"},{k:["f/4"],d:"q"}], events: [{beat:1,sub:0,inst:"snare"},{beat:3,sub:0,inst:"kick"}] },
      { notes: [{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"},{k:["f/4"],d:"8"},{k:["b/4"],d:"8r"},{k:["b/4"],d:"qr"}], events: [{beat:0,sub:1,inst:"snare"},{beat:2,sub:0,inst:"kick"}] },
      { notes: [{k:["c/5"],d:"q"},{k:["b/4"],d:"qr"},{k:["f/4"],d:"q"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"}], events: [{beat:0,sub:0,inst:"snare"},{beat:2,sub:0,inst:"kick"},{beat:3,sub:1,inst:"snare"}] },
      { notes: [{k:["f/4"],d:"q"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["f/4"],d:"q"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"}], events: [{beat:0,sub:0,inst:"kick"},{beat:1,sub:1,inst:"snare"},{beat:2,sub:0,inst:"kick"},{beat:3,sub:1,inst:"snare"}] },
      { notes: [{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["f/4"],d:"q"},{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"}], events: [{beat:0,sub:1,inst:"snare"},{beat:1,sub:0,inst:"kick"},{beat:3,sub:1,inst:"kick"}] },
      { notes: [{k:["f/4"],d:"8"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"q"},{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"},{k:["c/5"],d:"q"}], events: [{beat:0,sub:0,inst:"kick"},{beat:1,sub:0,inst:"snare"},{beat:2,sub:1,inst:"kick"},{beat:3,sub:0,inst:"snare"}] },
      { notes: [{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"},{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"},{k:["f/4"],d:"q"},{k:["b/4"],d:"qr"}], events: [{beat:0,sub:1,inst:"kick"},{beat:1,sub:1,inst:"kick"},{beat:2,sub:0,inst:"kick"}] },
      { notes: [{k:["c/5"],d:"q"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"qr"},{k:["c/5"],d:"q"}], events: [{beat:0,sub:0,inst:"snare"},{beat:1,sub:1,inst:"snare"},{beat:3,sub:0,inst:"snare"}] },
      { notes: [{k:["c/5"],d:"8"},{k:["b/4"],d:"8r"},{k:["b/4"],d:"qr"},{k:["c/5"],d:"8"},{k:["b/4"],d:"8r"},{k:["f/4"],d:"q"}], events: [{beat:0,sub:0,inst:"snare"},{beat:2,sub:0,inst:"snare"},{beat:3,sub:0,inst:"kick"}] },
      { notes: [{k:["b/4"],d:"qr"},{k:["f/4"],d:"q"},{k:["c/5"],d:"8"},{k:["b/4"],d:"8r"},{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"}], events: [{beat:1,sub:0,inst:"kick"},{beat:2,sub:0,inst:"snare"},{beat:3,sub:1,inst:"kick"}] },
      { notes: [{k:["c/5"],d:"q"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"},{k:["b/4"],d:"qr"}], events: [{beat:0,sub:0,inst:"snare"},{beat:1,sub:1,inst:"snare"},{beat:2,sub:1,inst:"kick"}] },
      { notes: [{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"},{k:["b/4"],d:"qr"}], events: [{beat:0,sub:1,inst:"snare"},{beat:1,sub:1,inst:"snare"},{beat:2,sub:1,inst:"kick"}] }
    ];

    // =========================================================================
    // フィルイン・ボキャブラリー
    // 『The Art of Bop Drumming』(pp. 36-43: Solo Ideas) & 『Beyond Bop』
    // =========================================================================

    // --- 2拍フィル (Bar 8の後半2拍) ---
    const fills2Beats = [
      {
        notes: [{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["f/4"],d:"q"}],
        play: (time, upbeat, snare, kick) => {
          const q = Tone.Time("4n").toSeconds();
          snare.triggerAttackRelease("16n", time);
          snare.triggerAttackRelease("16n", time + upbeat);
          kick.triggerAttackRelease("C1", "8n", time + q);
        }
      },
      {
        notes: [{k:["c/5"],d:"16"},{k:["c/5"],d:"16"},{k:["f/4"],d:"16"},{k:["f/4"],d:"16"},{k:["c/5"],d:"q"}],
        play: (time, upbeat, snare, kick) => {
          const q = Tone.Time("4n").toSeconds();
          const sx = q / 4;
          snare.triggerAttackRelease("16n", time);
          snare.triggerAttackRelease("16n", time + sx);
          kick.triggerAttackRelease("C1", "8n", time + sx * 2);
          kick.triggerAttackRelease("C1", "8n", time + sx * 3);
          snare.triggerAttackRelease("16n", time + q);
        }
      },
      {
        notes: [{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"},{k:["f/4"],d:"q"}],
        play: (time, upbeat, snare, kick) => {
          const q = Tone.Time("4n").toSeconds();
          snare.triggerAttackRelease("16n", time + upbeat);
          kick.triggerAttackRelease("C1", "8n", time + q);
        }
      },
      {
        notes: [{k:["c/5"],d:"8"},{k:["f/4"],d:"8"},{k:["c/5"],d:"8"},{k:["f/4"],d:"8"}],
        play: (time, upbeat, snare, kick) => {
          const q = Tone.Time("4n").toSeconds();
          snare.triggerAttackRelease("16n", time);
          kick.triggerAttackRelease("C1", "8n", time + upbeat);
          snare.triggerAttackRelease("16n", time + q);
          kick.triggerAttackRelease("C1", "8n", time + q + upbeat);
        }
      },
      // p. 40 Three-beat motifs truncated (2 beats)
      {
        notes: [{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["f/4"],d:"8"}],
        play: (time, upbeat, snare, kick) => {
          const q = Tone.Time("4n").toSeconds();
          snare.triggerAttackRelease("16n", time);
          snare.triggerAttackRelease("16n", time + upbeat);
          snare.triggerAttackRelease("16n", time + q);
          kick.triggerAttackRelease("C1", "8n", time + q + upbeat);
        }
      },
      // p. 43 Roll to accent finish
      {
        notes: [{k:["c/5"],d:"16"},{k:["c/5"],d:"16"},{k:["c/5"],d:"16"},{k:["c/5"],d:"16"},{k:["f/4"],d:"q"}],
        play: (time, upbeat, snare, kick) => {
          const q = Tone.Time("4n").toSeconds();
          const sx = q / 4;
          [0, 1, 2, 3].forEach(idx => snare.triggerAttackRelease("16n", time + idx * sx));
          kick.triggerAttackRelease("C1", "8n", time + q);
        }
      }
    ];

    // --- 1小節フィル (Bar 8 丸ごと) ---
    const fills1Bar = [
      // 1. Classic Dropping Bombs (p. 24)
      {
        notes: [{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["f/4"],d:"q"},{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["f/4"],d:"q"}],
        play: (time, upbeat, snare, kick) => {
          const q = Tone.Time("4n").toSeconds();
          snare.triggerAttackRelease("16n", time);
          snare.triggerAttackRelease("16n", time + upbeat);
          kick.triggerAttackRelease("C1", "8n", time + q);
          snare.triggerAttackRelease("16n", time + q * 2);
          snare.triggerAttackRelease("16n", time + q * 2 + upbeat);
          kick.triggerAttackRelease("C1", "8n", time + q * 3);
        }
      },
      // 2. Triplets in Groups of 4 (Beyond Bop p. 47 / Art of Bop p. 43)
      {
        notes: [{k:["c/5"],d:"16"},{k:["c/5"],d:"16"},{k:["f/4"],d:"16"},{k:["f/4"],d:"16"},{k:["c/5"],d:"16"},{k:["c/5"],d:"16"},{k:["f/4"],d:"16"},{k:["f/4"],d:"16"},{k:["c/5"],d:"q"},{k:["f/4"],d:"q"}],
        play: (time, upbeat, snare, kick) => {
          const q = Tone.Time("4n").toSeconds();
          const sx = q / 4;
          [0, 1].forEach(b => {
            const bt = time + b * q;
            snare.triggerAttackRelease("16n", bt);
            snare.triggerAttackRelease("16n", bt + sx);
            kick.triggerAttackRelease("C1", "8n", bt + sx * 2);
            kick.triggerAttackRelease("C1", "8n", bt + sx * 3);
          });
          snare.triggerAttackRelease("16n", time + q * 2);
          kick.triggerAttackRelease("C1", "8n", time + q * 3);
        }
      },
      // 3. Three-beat Phrases (Art of Bop pp. 40-41 / Beyond Bop p. 46)
      {
        notes: [{k:["c/5"],d:"8"},{k:["f/4"],d:"8"},{k:["c/5"],d:"q"},{k:["f/4"],d:"8"},{k:["c/5"],d:"8"},{k:["f/4"],d:"q"}],
        play: (time, upbeat, snare, kick) => {
          const q = Tone.Time("4n").toSeconds();
          snare.triggerAttackRelease("16n", time);
          kick.triggerAttackRelease("C1", "8n", time + upbeat);
          snare.triggerAttackRelease("16n", time + q);
          kick.triggerAttackRelease("C1", "8n", time + q * 2);
          snare.triggerAttackRelease("16n", time + q * 2 + upbeat);
          kick.triggerAttackRelease("C1", "8n", time + q * 3);
        }
      },
      // 4. Variable Speed Phrase (16ths to 8ths, Art of Bop p. 39 / Beyond Bop p. 46)
      {
        notes: [{k:["c/5"],d:"16"},{k:["c/5"],d:"16"},{k:["f/4"],d:"16"},{k:["f/4"],d:"16"},{k:["c/5"],d:"8"},{k:["f/4"],d:"8"},{k:["c/5"],d:"8"},{k:["f/4"],d:"8"},{k:["c/5"],d:"q"}],
        play: (time, upbeat, snare, kick) => {
          const q = Tone.Time("4n").toSeconds();
          const sx = q / 4;
          snare.triggerAttackRelease("16n", time);
          snare.triggerAttackRelease("16n", time + sx);
          kick.triggerAttackRelease("C1", "8n", time + sx * 2);
          kick.triggerAttackRelease("C1", "8n", time + sx * 3);
          snare.triggerAttackRelease("16n", time + q);
          kick.triggerAttackRelease("C1", "8n", time + q + upbeat);
          snare.triggerAttackRelease("16n", time + q * 2);
          kick.triggerAttackRelease("C1", "8n", time + q * 2 + upbeat);
          snare.triggerAttackRelease("16n", time + q * 3);
        }
      },
      // 5. Max Roach Cross Accent / Rhythmic Elasticity (Art of Bop pp. 36-39)
      {
        notes: [{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["f/4"],d:"8"},{k:["c/5"],d:"8"},{k:["c/5"],d:"8"},{k:["f/4"],d:"q"}],
        play: (time, upbeat, snare, kick) => {
          const q = Tone.Time("4n").toSeconds();
          snare.triggerAttackRelease("16n", time);
          snare.triggerAttackRelease("16n", time + upbeat);
          snare.triggerAttackRelease("16n", time + q);
          kick.triggerAttackRelease("C1", "8n", time + q + upbeat);
          snare.triggerAttackRelease("16n", time + q * 2);
          snare.triggerAttackRelease("16n", time + q * 2 + upbeat);
          kick.triggerAttackRelease("C1", "8n", time + q * 3);
        }
      },
      // 6. Syncopated Kick Bombs (Tony Williams / Art Blakey, pp. 24, 45)
      {
        notes: [{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"},{k:["c/5"],d:"q"},{k:["b/4"],d:"8r"},{k:["f/4"],d:"8"},{k:["c/5"],d:"q"}],
        play: (time, upbeat, snare, kick) => {
          const q = Tone.Time("4n").toSeconds();
          kick.triggerAttackRelease("C1", "8n", time + upbeat);
          snare.triggerAttackRelease("16n", time + q);
          kick.triggerAttackRelease("C1", "8n", time + q * 2 + upbeat);
          snare.triggerAttackRelease("16n", time + q * 3);
        }
      },
      // 7. Linear 4-Way Phrase (Hand to Foot Dialogue, pp. 26-28)
      {
        notes: [{k:["c/5"],d:"8"},{k:["f/4"],d:"8"},{k:["c/5"],d:"8"},{k:["f/4"],d:"8"},{k:["c/5"],d:"8"},{k:["f/4"],d:"8"},{k:["c/5"],d:"8"},{k:["f/4"],d:"8"}],
        play: (time, upbeat, snare, kick) => {
          const q = Tone.Time("4n").toSeconds();
          [0, 1, 2, 3].forEach(b => {
            snare.triggerAttackRelease("16n", time + b * q);
            kick.triggerAttackRelease("C1", "8n", time + b * q + upbeat);
          });
        }
      },
      // 8. Philly Joe Jones Rudimental Accent Fill (Art of Bop p. 43)
      {
        notes: [{k:["c/5"],d:"16"},{k:["c/5"],d:"16"},{k:["c/5"],d:"16"},{k:["c/5"],d:"16"},{k:["c/5"],d:"16"},{k:["c/5"],d:"16"},{k:["f/4"],d:"8"},{k:["c/5"],d:"8"},{k:["f/4"],d:"q"}],
        play: (time, upbeat, snare, kick) => {
          const q = Tone.Time("4n").toSeconds();
          const sx = q / 4;
          [0, 1, 2, 3, 4, 5].forEach(idx => snare.triggerAttackRelease("16n", time + idx * sx));
          kick.triggerAttackRelease("C1", "8n", time + q + sx * 2);
          snare.triggerAttackRelease("16n", time + q * 2);
          kick.triggerAttackRelease("C1", "8n", time + q * 3);
        }
      }
    ];

    // =========================================================================
    // 状態管理
    // =========================================================================
    let isPlaying = false;
    let currentBpm = 120;
    let practiceMode = "random";
    let fillLengthMode = "1bar"; // "2beats", "1bar", "1bar2beats", "2bars"

    let currentEtude = {
      bars: [] // 各小節オブジェクト: { notes: [...], events: [...], playFill: fn }
    };

    // UI Elements
    const playBtn = document.getElementById('play-btn');
    const bpmSlider = document.getElementById('bpm-slider');
    const bpmDisplay = document.getElementById('bpm-display');
    const statusText = document.getElementById('status-text');
    const beatDisplay = document.getElementById('beat-display');
    const modeSelect = document.getElementById('mode-select');
    const fillLenSelect = document.getElementById('fill-len-select');
    const regenerateBtn = document.getElementById('regenerate-btn');

    // --- エチュード生成ロジック ---
    function generateNewEtude() {
      currentEtude.bars = [];
      const fixedCompChoice = compingVocab[Math.floor(Math.random() * compingVocab.length)];

      function getCompingBar() {
        return practiceMode === "fixed" ? fixedCompChoice : compingVocab[Math.floor(Math.random() * compingVocab.length)];
      }

      if (fillLengthMode === "2beats") {
        // 1〜7小節: コンピング
        for (let i = 0; i < 7; i++) currentEtude.bars.push({ ...getCompingBar() });
        // 8小節目: 拍1-2コンピング + 拍3-4フィル
        const halfComp = {
          notes: [{k:["b/4"],d:"qr"},{k:["b/4"],d:"8r"},{k:["c/5"],d:"8"}],
          events: [{beat:1, sub:1, inst:"snare"}]
        };
        const fill2 = fills2Beats[Math.floor(Math.random() * fills2Beats.length)];
        currentEtude.bars.push({
          notes: [...halfComp.notes, ...fill2.notes],
          events: halfComp.events,
          playFill: (time, upbeat, snare, kick) => {
            const q = Tone.Time("4n").toSeconds();
            fill2.play(time + q * 2, upbeat, snare, kick);
          }
        });

      } else if (fillLengthMode === "1bar") {
        // 1〜7小節: コンピング
        for (let i = 0; i < 7; i++) currentEtude.bars.push({ ...getCompingBar() });
        // 8小節目: 1小節丸ごとフィル
        const fill1 = fills1Bar[Math.floor(Math.random() * fills1Bar.length)];
        currentEtude.bars.push({
          notes: fill1.notes,
          events: [],
          playFill: fill1.play
        });

      } else if (fillLengthMode === "1bar2beats") {
        // 1〜6小節: コンピング
        for (let i = 0; i < 6; i++) currentEtude.bars.push({ ...getCompingBar() });
        // 7小節目: 拍1-2コンピング + 拍3-4からフィル開始
        const halfComp = {
          notes: [{k:["c/5"],d:"q"},{k:["b/4"],d:"qr"}],
          events: [{beat:0, sub:0, inst:"snare"}]
        };
        const fillPart1 = fills2Beats[Math.floor(Math.random() * fills2Beats.length)];
        const fillPart2 = fills1Bar[Math.floor(Math.random() * fills1Bar.length)];
        currentEtude.bars.push({
          notes: [...halfComp.notes, ...fillPart1.notes],
          events: halfComp.events,
          playFill: (time, upbeat, snare, kick) => {
            const q = Tone.Time("4n").toSeconds();
            fillPart1.play(time + q * 2, upbeat, snare, kick);
          }
        });
        // 8小節目: フィル後半
        currentEtude.bars.push({
          notes: fillPart2.notes,
          events: [],
          playFill: fillPart2.play
        });

      } else if (fillLengthMode === "2bars") {
        // 1〜6小節: コンピング
        for (let i = 0; i < 6; i++) currentEtude.bars.push({ ...getCompingBar() });
        // 7〜8小節: 2小節連続フィル
        const fillA = fills1Bar[Math.floor(Math.random() * fills1Bar.length)];
        let fillB = fills1Bar[Math.floor(Math.random() * fills1Bar.length)];
        currentEtude.bars.push({
          notes: fillA.notes,
          events: [],
          playFill: fillA.play
        });
        currentEtude.bars.push({
          notes: fillB.notes,
          events: [],
          playFill: fillB.play
        });
      }
    }

    // --- Audio Engine Setup ---
    let clickHigh, clickLow, kick, snare;
    function initAudio() {
      if (clickHigh) return;
      clickHigh = new Tone.MembraneSynth({
        pitchDecay: 0.008,
        octaves: 2,
        oscillator: { type: "sine" },
        envelope: { attack: 0.001, decay: 0.05, sustain: 0 },
        volume: -2
      }).toDestination();

      clickLow = new Tone.MembraneSynth({
        pitchDecay: 0.008,
        octaves: 2,
        oscillator: { type: "sine" },
        envelope: { attack: 0.001, decay: 0.04, sustain: 0 },
        volume: -5
      }).toDestination();

      kick = new Tone.MembraneSynth({
        pitchDecay: 0.05,
        octaves: 4,
        oscillator: { type: "sine" },
        envelope: { attack: 0.001, decay: 0.3, sustain: 0.01, release: 0.2 },
        volume: 3
      }).toDestination();

      snare = new Tone.NoiseSynth({
        noise: { type: "white" },
        envelope: { attack: 0.001, decay: 0.18, sustain: 0 },
        volume: 1
      }).toDestination();
    }

    // --- Playback Logic ---
    async function togglePlayback() {
      if (isPlaying) {
        Tone.Transport.stop();
        Tone.Transport.cancel();
        isPlaying = false;
        playBtn.textContent = "Start";
        playBtn.className = "w-full md:w-48 py-4 rounded-xl font-bold text-lg text-white bg-blue-600 hover:bg-blue-700 transition-all shadow-md";
        statusText.textContent = "Ready";
        statusText.className = "text-xs font-bold text-blue-600 uppercase";
        beatDisplay.textContent = "1-1";
      } else {
        await Tone.start();
        initAudio();
        Tone.Transport.bpm.value = currentBpm;

        let barCount = 1;
        let beatCount = 0;

        Tone.Transport.scheduleRepeat((time) => {
          const quarter = Tone.Time("4n").toSeconds();
          const upbeat = quarter * 0.67; // スイングフィール

          if (beatCount === 0) clickHigh.triggerAttackRelease("G5", "32n", time, 1.0);
          else clickLow.triggerAttackRelease("C5", "32n", time, 0.8);

          const barData = currentEtude.bars[barCount - 1];

          if (barData) {
            if (barData.events && barData.events.length > 0) {
              barData.events.forEach(ev => {
                if (ev.beat === beatCount) {
                  const evTime = ev.sub === 0 ? time : time + upbeat;
                  if (ev.inst === "snare") snare.triggerAttackRelease("16n", evTime);
                  if (ev.inst === "kick") kick.triggerAttackRelease("C1", "8n", evTime);
                }
              });
            }
            if (beatCount === 0 && barData.playFill) {
              barData.playFill(time, upbeat, snare, kick);
            }
          }

          Tone.Draw.schedule(() => {
            beatDisplay.textContent = `${barCount}-${beatCount + 1}`;
            const isFillBar = (fillLengthMode === "2bars" && barCount >= 7) ||
                              (fillLengthMode === "1bar2beats" && (barCount === 8 || (barCount === 7 && beatCount >= 2))) ||
                              (fillLengthMode === "1bar" && barCount === 8) ||
                              (fillLengthMode === "2beats" && barCount === 8 && beatCount >= 2);

            if (isFillBar) {
              statusText.textContent = `Bar ${barCount}: Fill-in`;
              statusText.className = "text-xs font-bold text-red-500 uppercase tracking-wider";
            } else {
              statusText.textContent = `Bar ${barCount}: Comping`;
              statusText.className = "text-xs font-bold text-blue-600 uppercase tracking-wider";
            }
          }, time);

          beatCount++;
          if (beatCount > 3) {
            beatCount = 0;
            barCount++;
            if (barCount > 8) {
              barCount = 1;
              if (practiceMode === "random") {
                generateNewEtude();
                Tone.Draw.schedule(() => drawScore(), time + quarter);
              }
            }
          }
        }, "4n");

        Tone.Transport.start();
        isPlaying = true;
        playBtn.textContent = "Stop";
        playBtn.className = "w-full md:w-48 py-4 rounded-xl font-bold text-lg text-red-600 bg-red-100 hover:bg-red-200 transition-all shadow-md";
      }
    }

    // --- VexFlow 楽譜描画 ---
    function drawScore() {
      const VF = Vex.Flow;
      const container = document.getElementById("score-container");
      container.innerHTML = ""; 

      const renderer = new VF.Renderer(container, VF.Renderer.Backends.SVG);
      renderer.resize(950, 260);
      const context = renderer.getContext();

      const staves = [];
      const vfNotes = [];
      const beamsToDraw = [];

      let currentX = 10;
      let currentY = 10;

      for (let i = 0; i < 8; i++) {
        if (i === 4) {
          currentX = 10;
          currentY = 130;
        }

        const isStartOfLine = (i === 0 || i === 4);
        const width = isStartOfLine ? 230 : 220;

        const stave = new VF.Stave(currentX, currentY, width);

        // 先頭のみ打楽器記号を付与、4/4表記は完全に不要
        if (isStartOfLine) {
          stave.addClef("percussion");
          stave.setBegBarType(VF.Barline.type.SINGLE);
        } else {
          stave.setBegBarType(VF.Barline.type.NONE);
        }

        if (i === 3 || i === 7) {
          stave.setEndBarType(VF.Barline.type.END);
        }

        staves.push(stave);
        currentX += width;

        // 音符データ生成
        const barItem = currentEtude.bars[i];
        const notes = barItem.notes.map(nd => new VF.StaveNote({ clef: "percussion", keys: nd.k, duration: nd.d }));
        vfNotes.push(notes);

        // 自動ビーム生成 (休符を巻き込まず美しく連桁)
        const autoBeams = VF.Beam.generateBeams(notes, {
          beam_rests: false,
          maintain_stem_directions: true
        });
        beamsToDraw.push(...autoBeams);
      }

      // レンダリング & ビーム描画
      for (let i = 0; i < 8; i++) {
        staves[i].setContext(context).draw();
        VF.Formatter.FormatAndDraw(context, staves[i], vfNotes[i]);
      }
      beamsToDraw.forEach(beam => beam.setContext(context).draw());
    }

    // --- イベントリスナー ---
    modeSelect.addEventListener('change', (e) => {
      practiceMode = e.target.value;
      generateNewEtude();
      drawScore();
    });

    fillLenSelect.addEventListener('change', (e) => {
      fillLengthMode = e.target.value;
      generateNewEtude();
      drawScore();
    });

    regenerateBtn.addEventListener('click', () => {
      generateNewEtude();
      drawScore();
    });

    bpmSlider.addEventListener('input', (e) => {
      currentBpm = Number(e.target.value);
      bpmDisplay.textContent = currentBpm;
      if (Tone.Transport.state === "started") Tone.Transport.bpm.value = currentBpm;
    });

    playBtn.addEventListener('click', togglePlayback);

    // 初期生成 & 描画
    generateNewEtude();
    drawScore();
  </script>
</body>
</html>
