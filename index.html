<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jazz Drummer's Etude</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <!-- 楽譜描画用のVexFlow -->
  <script src="https://unpkg.com/vexflow/releases/vexflow-debug.js"></script>
  <style>
    body { background-color: #0f1115; color: #e2e8f0; font-family: 'Inter', sans-serif; }
    .active-bar { background-color: #3b82f6; color: white; border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
    .fill-bar { background-color: #f59e0b; color: #1e293b; border-color: #f59e0b; box-shadow: 0 0 15px rgba(245, 158, 11, 0.5); }
    #score-container svg { max-width: 100%; height: auto; } /* スマホ対応 */
  </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4">

  <div class="max-w-2xl w-full space-y-8">
    
    <!-- ヘッダー -->
    <div class="text-center space-y-2">
      <h1 class="text-3xl font-bold tracking-tight text-white">Jazz Drummer's Etude</h1>
      <p class="text-gray-400">Beyond Bop Concept: 7-Bar Comping & 1-Bar Fill</p>
    </div>

    <!-- 小節トラッカー -->
    <div class="bg-gray-800/50 border border-gray-700 p-6 rounded-2xl shadow-xl">
      <div class="flex justify-between items-center mb-4">
        <span class="text-sm font-semibold text-gray-400 uppercase tracking-wider">Bar Tracker</span>
        <span id="status-text" class="text-sm font-bold text-blue-400">Comping</span>
      </div>
      <div class="grid grid-cols-8 gap-2" id="bar-tracker">
        <!-- JSで生成 -->
      </div>
    </div>

    <!-- 楽譜表示エリア (VexFlow) -->
    <div class="bg-white p-6 rounded-2xl shadow-xl flex flex-col items-center relative overflow-hidden">
      <div class="absolute top-0 left-0 w-full h-1 bg-amber-500"></div>
      <h2 class="text-gray-800 font-bold mb-2 text-center w-full">Bar 8: Fill-in (Dropping Bombs)</h2>
      <p class="text-xs text-gray-500 mb-4">※スネアとバスドラムのコンビネーションフレーズ</p>
      
      <!-- ここに楽譜がレンダリングされます -->
      <div id="score-container" class="w-full flex justify-center"></div>
    </div>

    <!-- コントロール -->
    <div class="bg-gray-800/50 border border-gray-700 p-6 rounded-2xl shadow-xl space-y-6">
      <div class="flex items-center justify-between">
        <label class="text-sm font-semibold text-gray-400">BPM (Tempo)</label>
        <div class="text-2xl font-bold text-white"><span id="bpm-display">160</span></div>
      </div>
      <input type="range" id="bpm-slider" min="80" max="260" step="1" value="160" class="w-full h-2 bg-gray-700 rounded-full appearance-none cursor-pointer accent-blue-500" />
      
      <button id="play-btn" class="w-full py-4 rounded-xl font-bold text-lg transition-all duration-200 bg-blue-600 text-white hover:bg-blue-500 active:scale-[0.98] shadow-lg shadow-blue-900/50">
        START PRACTICE
      </button>
    </div>

  </div>

  <script>
    // --- UI要素の取得 ---
    const playBtn = document.getElementById('play-btn');
    const bpmSlider = document.getElementById('bpm-slider');
    const bpmDisplay = document.getElementById('bpm-display');
    const barTracker = document.getElementById('bar-tracker');
    const statusText = document.getElementById('status-text');

    // 小節トラッカーの生成
    const bars = [];
    for(let i = 1; i <= 8; i++) {
      const div = document.createElement('div');
      div.className = 'h-12 flex items-center justify-center rounded-lg border border-gray-700 text-gray-500 font-bold transition-all duration-200';
      div.textContent = i;
      barTracker.appendChild(div);
      bars.push(div);
    }

    // --- State ---
    let isPlaying = false;
    let currentBpm = 160;
    let transportId = null;
    let synths = {};

    // --- 楽譜の描画 (VexFlow) ---
    function drawScore() {
      const VF = Vex.Flow;
      const container = document.getElementById("score-container");
      container.innerHTML = ""; // 初期化

      // レンダラーの作成 (レスポンシブに対応しやすいSVG)
      const renderer = new VF.Renderer(container, VF.Renderer.Backends.SVG);
      renderer.resize(350, 120);
      const context = renderer.getContext();

      // 五線譜（Stave）の作成
      const stave = new VF.Stave(10, 0, 330);
      stave.addClef("percussion").addTimeSignature("4/4");
      stave.setContext(context).draw();

      // 8小節目のフレーズ (Dropping Bombs)
      // 1拍目: スネア(四分) | 2拍目: キック(四分) | 3拍目: スネア(八分2つ) | 4拍目: キック(四分)
      const notes = [
        new VF.StaveNote({ clef: "percussion", keys: ["c/5"], duration: "q" }), // Snare
        new VF.StaveNote({ clef: "percussion", keys: ["f/4"], duration: "q" }), // Kick
        new VF.StaveNote({ clef: "percussion", keys: ["c/5"], duration: "8" }), // Snare
        new VF.StaveNote({ clef: "percussion", keys: ["c/5"], duration: "8" }), // Snare
        new VF.StaveNote({ clef: "percussion", keys: ["f/4"], duration: "q" })  // Kick
      ];

      // 8分音符の連桁（ビーム）を自動生成
      const beams = VF.Beam.generateBeams(notes);
      
      // 描画
      VF.Formatter.FormatAndDraw(context, stave, notes);
      beams.forEach(b => b.setContext(context).draw());
    }

    // 初回描画
    drawScore();

    // --- Tone.js セットアップ ---
    function initSynths() {
      if(Object.keys(synths).length > 0) return;
      synths = {
        kick: new Tone.MembraneSynth().toDestination(),
        snare: new Tone.NoiseSynth({
          noise: { type: "white" },
          envelope: { attack: 0.001, decay: 0.2, sustain: 0 },
          volume: -5,
        }).toDestination(),
        ride: new Tone.MetalSynth({
          frequency: 250,
          envelope: { attack: 0.001, decay: 1.4, release: 0.2 },
          harmonicity: 5.1,
          modulationIndex: 32,
          resonance: 4000,
          octaves: 1.5,
          volume: -8,
        }).toDestination(),
        hihat: new Tone.MetalSynth({
          frequency: 400,
          envelope: { attack: 0.001, decay: 0.1, release: 0.01 },
          harmonicity: 5.1,
          modulationIndex: 32,
          resonance: 4000,
          octaves: 1.5,
          volume: -10,
        }).toDestination()
      };
    }

    // --- UI更新ロジック ---
    function updateUI(bar) {
      // 全てのハイライトを消す
      bars.forEach(b => {
        b.classList.remove('active-bar', 'fill-bar');
        b.classList.add('border-gray-700', 'text-gray-500');
      });

      // 現在の小節をハイライト
      const activeDiv = bars[bar - 1];
      activeDiv.classList.remove('border-gray-700', 'text-gray-500');
      
      if (bar === 8) {
        activeDiv.classList.add('fill-bar');
        statusText.textContent = "Fill-in!";
        statusText.className = "text-sm font-bold text-amber-500";
      } else {
        activeDiv.classList.add('active-bar');
        statusText.textContent = "Comping";
        statusText.className = "text-sm font-bold text-blue-400";
      }
    }

    // --- 音楽再生ロジック ---
    async function togglePlayback() {
      if (isPlaying) {
        Tone.Transport.stop();
        if (transportId !== null) Tone.Transport.clear(transportId);
        isPlaying = false;
        
        playBtn.textContent = "START PRACTICE";
        playBtn.className = "w-full py-4 rounded-xl font-bold text-lg transition-all duration-200 bg-blue-600 text-white hover:bg-blue-500 active:scale-[0.98] shadow-lg shadow-blue-900/50";
        
        // UIリセット
        bars.forEach(b => {
          b.classList.remove('active-bar', 'fill-bar');
          b.classList.add('border-gray-700', 'text-gray-500');
        });
        statusText.textContent = "Ready";

      } else {
        await Tone.start();
        initSynths();
        
        Tone.Transport.bpm.value = currentBpm;
        Tone.Transport.swing = 0.55; // ジャズのスイングフィール
        Tone.Transport.swingSubdivision = "8n";

        let barCount = 1;
        let beatCount = 0;

        transportId = Tone.Transport.scheduleRepeat((time) => {
          const { kick, snare, ride, hihat } = synths;
          
          // UIを音のタイミングと同期して更新
          if (beatCount === 0) {
            Tone.Draw.schedule(() => updateUI(barCount), time);
          }

          if (barCount <= 7) {
            // 【1〜7小節目】 コンピング
            ride.triggerAttackRelease("4n", time, 0.7); 
            
            if (beatCount === 1 || beatCount === 3) {
              ride.triggerAttackRelease("8n", time + Tone.Time("8n").toSeconds(), 0.4);
              hihat.triggerAttackRelease("8n", time, 0.8); // 2, 4拍目のハイハット
            }

            kick.triggerAttackRelease("C1", "8n", time, 0.1); // フェザリング

            if (barCount % 2 === 0 && beatCount === 2) {
              snare.triggerAttackRelease("8n", time + Tone.Time("8n").toSeconds(), 0.6); // 3拍裏のスネア
            }

          } else {
            // 【8小節目】 フィル（楽譜と完全に一致するロジック）
            // 1拍目: スネア(四分)
            if (beatCount === 0) {
              snare.triggerAttackRelease("8n", time, 0.9);
              ride.triggerAttackRelease("4n", time, 0.8);
            }
            // 2拍目: キック(四分)
            if (beatCount === 1) {
              kick.triggerAttackRelease("C1", "8n", time, 1);
              hihat.triggerAttackRelease("8n", time, 0.7);
            }
            // 3拍目: スネア(八分2つ)
            if (beatCount === 2) {
              snare.triggerAttackRelease("16n", time, 0.8);
              snare.triggerAttackRelease("16n", time + Tone.Time("8n").toSeconds(), 0.8);
              ride.triggerAttackRelease("4n", time, 0.8);
            }
            // 4拍目: キック(四分)
            if (beatCount === 3) {
              kick.triggerAttackRelease("C1", "8n", time, 1);
              hihat.triggerAttackRelease("8n", time, 0.7);
            }
          }

          beatCount++;
          if (beatCount > 3) {
            beatCount = 0;
            barCount++;
            if (barCount > 8) barCount = 1;
          }
        }, "4n");

        Tone.Transport.start();
        isPlaying = true;

        playBtn.textContent = "STOP";
        playBtn.className = "w-full py-4 rounded-xl font-bold text-lg transition-all duration-200 bg-red-500/20 text-red-500 border border-red-500/50 hover:bg-red-500/30 active:scale-[0.98]";
      }
    }

    // --- イベントリスナー ---
    playBtn.addEventListener('click', togglePlayback);
    
    bpmSlider.addEventListener('input', (e) => {
      currentBpm = Number(e.target.value);
      bpmDisplay.textContent = currentBpm;
      if (Tone.Transport.state === "started") {
        Tone.Transport.bpm.rampTo(currentBpm, 0.1);
      }
    });

  </script>
</body>
</html>
